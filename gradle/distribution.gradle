/* Universal payload assembly and Windows distribution. */
def locateJdkHome = moonsToolchains.locateJdkHome
def locateCSharpCompiler = moonsToolchains.locateCSharpCompiler
def apiJar = tasks.named("apiJar", Jar)
def bridgeDll = tasks.named("bridgeDll")
def uiDependenciesJar = tasks.named("uiDependenciesJar")
def nestedGradleExecutable = moonsToolchains.gradleExecutable

def nestedInvocation = ProcessHandle.current().pid().toString()
def nestedPayloadBuildRoot = layout.buildDirectory.dir("universal-work/${nestedInvocation}").get().asFile

def universalPayload26_1 = tasks.register("universalPayload26_1", Exec) {
    group = "build"
    description = "Builds the Minecraft 26.1 payload for the universal loader."
    def nestedBuild = "${nestedPayloadBuildRoot}/26.1"
    def nestedPayload = file("${nestedBuild}/universal/26.1/moons.jar")
    def publishedPayload = layout.buildDirectory.file("universal/26.1/moons.jar")
    outputs.file(publishedPayload)
    outputs.upToDateWhen { false }
    workingDir project.projectDir
    executable nestedGradleExecutable.absolutePath
    args moonsToolchains.nestedGradleArguments([
            "moonsJar",
            "-Pminecraft_version=26.1.2",
            "-Pmoons_build_directory=${nestedBuild}",
            "-Pmoons_jar_output_directory=universal/26.1"
    ].collect { it.toString() })
    doLast {
        if (!nestedPayload.isFile()) {
            throw new GradleException("Nested 26.1 payload was not produced: ${nestedPayload}")
        }
        def destination = publishedPayload.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                nestedPayload.toPath(),
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}
universalPayload26_1.configure {
    mustRunAfter apiJar, bridgeDll
}

