/* Production Java payload archives. */
def versionedPayloadDirectory = moonsBuild.payloadDirectory
def moonsJarOutputDirectory = moonsBuild.jarOutputDirectory

jar {
    enabled = false
}

def apiJar = tasks.register("apiJar", Jar) {
    archiveFileName = "moons-api.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    from sourceSets.api.output
}

def runtimeJar = tasks.register("runtimeJar", Jar) {
    archiveFileName = "moons-runtime.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    from sourceSets.runtime.output
}

def uiDependenciesJar = tasks.register("uiDependenciesJar", moonsPluginTypes.shadowJar) {
    archiveFileName = "moons-ui-runtime.jar"
    destinationDirectory = layout.buildDirectory.dir("dist/dependencies")
    configurations = [project.configurations.composeEmbedded, project.configurations.legacyRuntimeSupport]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    exclude "META-INF/INDEX.LIST"
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    exclude "META-INF/versions/*/module-info.class", "module-info.class"
}

def clientModuleNamedJar = tasks.register("clientModuleNamedJar", Jar) {
    archiveFileName = "moons-core-features.jar"
    destinationDirectory = layout.buildDirectory.dir('named/' + versionedPayloadDirectory)
    dependsOn tasks.named("clientClasses")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.client.output
}
def remapClient = registerMinecraft189Remap('remapClient189', clientModuleNamedJar, 'remapped/moons-core-features.jar')
def clientModuleJar = tasks.register('clientModuleJar', Jar) {
    dependsOn remapClient
    archiveFileName = 'moons-core-features.jar'
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    from({ zipTree(layout.buildDirectory.file('remapped/moons-core-features.jar').get().asFile) })
}

tasks.register("moonsJar", Jar) {
    group = "build"
    description = "Builds the Java payload loaded by the JNI/JVMTI bridge."
    dependsOn apiJar, runtimeJar, clientModuleJar, tasks.named("loaderClasses")

    archiveFileName = "moons.jar"
    destinationDirectory = layout.buildDirectory.dir(moonsJarOutputDirectory)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.loader.output
    from({
        configurations.loaderRuntimeClasspath
                .findAll { it.isFile() }
                .collect { zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        exclude "module-info.class"
    }
    into("META-INF/moons/bootstrap") {
        from(apiJar.flatMap { it.archiveFile })
    }
    into("META-INF/moons/runtime") {
        from(runtimeJar.flatMap { it.archiveFile })
    }
    into("META-INF/moons/modules") {
        from(clientModuleJar.flatMap { it.archiveFile })
    }

    manifest {
        attributes(
                "Implementation-Title": "Moons JNI/JVMTI payload",
                "Implementation-Version": project.version
        )
    }
}
