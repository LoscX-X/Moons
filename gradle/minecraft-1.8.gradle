import java.security.MessageDigest

// Vanilla and MCP are verified build inputs, never dependencies embedded in Moons.
def gameHome = providers.gradleProperty('minecraft_home').getOrElse("${System.getenv('APPDATA')}/.minecraft")
def gameJar = providers.gradleProperty('minecraft_189_jar').map { file(it) }.getOrElse(file("${gameHome}/versions/1.8.9/1.8.9.jar"))
def digest = { File input, String algorithm -> MessageDigest.getInstance(algorithm).digest(input.bytes).encodeHex().toString() }
def obtain = { File target, File local, String url, String hash, String algorithm ->
    if (target.isFile() && digest(target,algorithm) == hash) return
    target.parentFile.mkdirs()
    File temporary = new File(target.parentFile,target.name + '.part')
    try {
        if (local != null && local.isFile() && digest(local,algorithm) == hash) temporary.bytes = local.bytes
        else {
            if (gradle.startParameter.offline) throw new GradleException("Missing verified input: ${target}")
            new URI(url).toURL().openConnection().with { connection ->
                connection.connectTimeout = 15000; connection.readTimeout = 60000
                connection.inputStream.withCloseable { input -> temporary.withOutputStream { it << input } }
            }
        }
        if (digest(temporary,algorithm) != hash) throw new GradleException("Checksum mismatch: ${target.name}")
        java.nio.file.Files.move(temporary.toPath(),target.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    } finally { temporary.delete() }
}
sourceSets { mapping { java.srcDirs = ['src/tools/mapping/java'] } }
configurations { legacyRuntimeSupport }
dependencies {
    mappingImplementation 'org.ow2.asm:asm-commons:9.10.1'
    clientCompileOnly files(layout.buildDirectory.file('minecraft189/minecraft-1.8.9-named.jar')).builtBy('prepareMinecraft189')
    clientImplementation 'com.google.code.gson:gson:2.13.2'
    clientImplementation 'org.joml:joml:1.10.8'
    clientImplementation 'it.unimi.dsi:fastutil:8.5.18'
    legacyRuntimeSupport 'com.google.code.gson:gson:2.13.2'
    legacyRuntimeSupport 'org.joml:joml:1.10.8'
    legacyRuntimeSupport 'it.unimi.dsi:fastutil:8.5.18'
    legacyRuntimeSupport 'org.apache.commons:commons-lang3:3.20.0'
    legacyRuntimeSupport files(layout.buildDirectory.file('minecraft189/libraries/brigadier-1.3.10.jar')).builtBy('prepareMinecraft189Inputs')
    clientImplementation files(layout.buildDirectory.file('minecraft189/libraries/brigadier-1.3.10.jar')).builtBy('prepareMinecraft189Inputs')
}
// JDK 7/8 stdlib facades were merged into kotlin-stdlib; avoid resolving obsolete empty jars.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
repositories { maven { url = uri('https://libraries.minecraft.net') } }
def libraries = new groovy.json.JsonSlurper().parse(file('gradle/minecraft-1.8-libraries.json')).collect { [it.path, it.sha1] }
libraries.add(['com/mojang/brigadier/1.3.10/brigadier-1.3.10.jar','d15b53a14cf20fdcaa98f731af5dda654452c010'])
def inputDir = layout.buildDirectory.dir('minecraft189')
tasks.register('prepareMinecraft189Inputs') {
    outputs.files(inputDir.map { it.file('client.jar') }, inputDir.map { it.file('joined.srg') }, inputDir.map { it.file('fields.csv') },inputDir.map { it.file('methods.csv') })
    outputs.files(libraries.collect { inputDir.get().file('libraries/' + it[0].tokenize('/').last()) })
    doLast {
        File root = inputDir.get().asFile
        obtain(new File(root,'client.jar'),gameJar,'https://launcher.mojang.com/v1/objects/3870888a6c3d349d3771a3e9d16c9bf5e076b908/client.jar','3870888a6c3d349d3771a3e9d16c9bf5e076b908','SHA-1')
        obtain(new File(root,'srg.zip'),file('build/mappings/srg.zip'),'https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp/1.8.9/mcp-1.8.9-srg.zip','ea6fdd37e68569a378fd149b0ab7cfede1de7fa3e794f4ed81f9018366fbdc51','SHA-256')
        obtain(new File(root,'names.zip'),file('build/mappings/names.zip'),'https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_stable/22-1.8.9/mcp_stable-22-1.8.9.zip','aeed0aaba9d159b7ce60a21e2dcc36adb249fade65ce2f76c730dd0ec7270763','SHA-256')
        copy { from zipTree(new File(root,'srg.zip')); include 'joined.srg'; into root }
        copy { from zipTree(new File(root,'names.zip')); include 'fields.csv','methods.csv'; into root }
        libraries.each { entry ->
            String name = entry[0].tokenize('/').last()
            File local = file("${gameHome}/libraries/${entry[0]}")
            if (!local.isFile()) local = file("build/minecraft/libraries/${name}")
            obtain(new File(root,"libraries/${name}"),local,"https://libraries.minecraft.net/${entry[0]}",entry[1],'SHA-1')
        }
    }
}
tasks.register('prepareMinecraft189', JavaExec) {
    dependsOn 'mappingClasses','prepareMinecraft189Inputs'
    classpath = sourceSets.mapping.runtimeClasspath
    mainClass = 'com.blanoir.moons.tools.mapping.McpRemapper'
    inputs.files(inputDir.map { it.file('client.jar') }, inputDir.map { it.file('joined.srg') },inputDir.map { it.file('fields.csv') },inputDir.map { it.file('methods.csv') })
    outputs.file(inputDir.map { it.file('minecraft-1.8.9-named.jar') })
    doFirst {
        File root = inputDir.get().asFile
        args = ['forward',new File(root,'joined.srg'),new File(root,'fields.csv'),new File(root,'methods.csv'),new File(root,'client.jar'),new File(root,'minecraft-1.8.9-named.jar'),new File(root,'client.jar')]
    }
}
def legacyLibraries = files(libraries.collect { inputDir.get().file('libraries/' + it[0].tokenize('/').last()) }).builtBy('prepareMinecraft189Inputs')
sourceSets.client.compileClasspath += legacyLibraries
sourceSets.client.compileClasspath += legacyLibraries
tasks.named('compileClientJava') { dependsOn 'prepareMinecraft189'; options.compilerArgs.addAll(['-Xmaxerrs','3000']) }
tasks.named('compileClientKotlin') { dependsOn 'prepareMinecraft189' }

tasks.register('generateMinecraft189Hooks', JavaExec) {
    dependsOn 'prepareMinecraft189'
    classpath = sourceSets.mapping.runtimeClasspath
    mainClass = 'com.blanoir.moons.tools.mapping.McpHookTable'
    inputs.files(inputDir.map { it.file('minecraft-1.8.9-named.jar') }, inputDir.map { it.file('joined.srg') },inputDir.map { it.file('methods.csv') })
    outputs.file(layout.buildDirectory.file('generated/loader/moons/1_8/hooks.tsv'))
    outputs.file(layout.buildDirectory.file('generated/loader/moons/1_8/members.properties'))
    args inputDir.get().asFile, layout.buildDirectory.file('generated/loader/moons/1_8/hooks.tsv').get().asFile
}
sourceSets.loader.resources.srcDir(layout.buildDirectory.dir('generated/loader'))
sourceSets.client.resources.srcDir(layout.buildDirectory.dir('generated/loader'))
tasks.named('processClientResources') { dependsOn 'generateMinecraft189Hooks' }
tasks.named('processLoaderResources') { dependsOn 'generateMinecraft189Hooks' }

// Keep named compiler output available for diagnostics; only remapped archives are distributed.
ext.registerMinecraft189Remap = { String taskName, def namedArchive, String outputPath ->
    tasks.register(taskName, JavaExec) {
        dependsOn namedArchive, 'prepareMinecraft189'
        classpath = sourceSets.mapping.runtimeClasspath
        mainClass = 'com.blanoir.moons.tools.mapping.McpRemapper'
        inputs.file(namedArchive.flatMap { it.archiveFile })
        inputs.files(inputDir.map { it.file('joined.srg') }, inputDir.map { it.file('fields.csv') }, inputDir.map { it.file('methods.csv') })
        outputs.file(layout.buildDirectory.file(outputPath))
        doFirst {
            File root = inputDir.get().asFile
            args = ['reverse', new File(root,'joined.srg'), new File(root,'fields.csv'), new File(root,'methods.csv'), namedArchive.get().archiveFile.get().asFile, layout.buildDirectory.file(outputPath).get().asFile, new File(root,'minecraft-1.8.9-named.jar')]
        }
    }
}
