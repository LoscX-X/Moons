/* Source-set boundaries, dependency declarations, and compiler configuration. */
def selectedVersionDirectory = temposBuild.versionDirectory
def selectedMinecraftVersion = temposBuild.minecraftVersion
def targetJavaVersion = temposBuild.targetJavaVersion

repositories {
    mavenCentral()
    google()
}

configurations {
    graphicsRuntime
}

sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    api {
        java.setSrcDirs(["src/bootstrap/api/java"])
        resources.setSrcDirs(["src/bootstrap/api/resources"])
    }
    loader {
        java.setSrcDirs([
                "src/bootstrap/loader/java",
                "src/common/loader",
                "src/minecraft/versions/${selectedVersionDirectory}/loader"
        ])
        resources.setSrcDirs(["src/bootstrap/loader/resources"])
        compileClasspath += sourceSets.api.output
    }
    runtime {
        java.setSrcDirs(["src/bootstrap/runtime/java"])
        resources.setSrcDirs(["src/bootstrap/runtime/resources"])
        compileClasspath += sourceSets.api.output
    }
    loaderTest {
        // The mapping verifier reads real Minecraft bytecode through the production transformer.
        java.setSrcDirs(["src/test/loader/java"])
        resources.setSrcDirs(["src/test/loader/resources"])
        compileClasspath += sourceSets.loader.output + sourceSets.runtime.output + sourceSets.api.output + configurations.loaderRuntimeClasspath
        runtimeClasspath += sourceSets.loader.output + sourceSets.runtime.output + sourceSets.api.output + configurations.loaderRuntimeClasspath
    }
}

version = project.load_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
}

configurations.named("clientImplementation") {
    extendsFrom configurations.graphicsRuntime
}

sourceSets.client.java.setSrcDirs([
        "src/common/java",
        "src/minecraft/versions/${selectedVersionDirectory}/client/java"
])
sourceSets.client.kotlin.setSrcDirs([
        "src/common/kotlin",
        "src/minecraft/versions/${selectedVersionDirectory}/client/kotlin"
])
sourceSets.client.resources.setSrcDirs([
        "src/common/resources",
        "src/minecraft/versions/${selectedVersionDirectory}/client/resources"
])

tasks.named("processClientResources") {
    inputs.property("minecraftVersion", selectedMinecraftVersion)
    filesMatching("META-INF/tempos-module.properties") {
        expand(minecraftVersion: selectedMinecraftVersion)
    }
    from(layout.projectDirectory.dir("src/libraries/models/aim")) {
        include("aim-gru128-epoch7.bin", "aim-gru128-epoch7.json")
        into("assets/tempos/models")
    }
}

// Loom creates the split client source set after the Kotlin plugin has applied.
// Explicitly expose its Java roots to K2 so Kotlin can resolve the existing
// module registry and Minecraft screen classes during joint compilation.
tasks.named("compileClientKotlin", temposPluginTypes.kotlinCompile) {
    source(sourceSets.client.java)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // GUI glyphs use Minecraft's STB runtime; world labels use the JDK rasterizer.
    graphicsRuntime "org.jetbrains.kotlin:kotlin-stdlib:2.3.20"

    // The standalone loader is deliberately isolated from Fabric/Minecraft.
    // Its only non-JDK dependency is ASM, which is folded into tempos.jar.
    loaderImplementation "org.ow2.asm:asm:9.10.1"
    loaderImplementation "org.ow2.asm:asm-tree:9.10.1"
    loaderImplementation "org.ow2.asm:asm-util:9.10.1"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = temposPluginTypes.jvmTarget25
    }
}

tasks.named("compileLoaderJava", JavaCompile).configure {
    options.compilerArgs.addAll(["--add-modules", "jdk.attach"])
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

sourceSets.client.compileClasspath += sourceSets.api.output + sourceSets.runtime.output

// Compilation-only entry points remain available; CI runs the full version checks by default.
def versionCompilations = []
temposBuild.supportedVersions.each { minecraftVersion, directory ->
    def versionCompilation = temposMultiVersion.register(directory, "compileMinecraft${directory}", 'build',
            "Compiles production sources for Minecraft ${minecraftVersion} without verification.",
            ['clientClasses', 'loaderClasses', 'ysmClasses'])
    versionCompilations.add(versionCompilation)
}

tasks.register("compileAllVersions") {
    group = "build"
    description = "Compiles production sources for every supported Minecraft version without tests or custom verification."
    dependsOn versionCompilations
}
