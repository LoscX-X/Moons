def nestedGradleExecutable = new File(
        gradle.gradleHomeDir,
        windowsHost ? "bin/gradle.bat" : "bin/gradle"
)
def nestedInvocation = ProcessHandle.current().pid().toString()
def nestedPayloadBuildRoot = "build/universal-work/${nestedInvocation}"

def universalPayload26_1 = tasks.register("universalPayload26_1", Exec) {
    group = "build"
    description = "Builds the Minecraft 26.1 payload for the universal injector."
    def nestedBuild = "${nestedPayloadBuildRoot}/26.1"
    def nestedPayload = file("${nestedBuild}/universal/26.1/moons.jar")
    def publishedPayload = layout.buildDirectory.file("universal/26.1/moons.jar")
    workingDir project.projectDir
    commandLine nestedGradleExecutable.absolutePath,
            "moonsJar",
            "-Pminecraft_version=26.1.2",
            "-Pmoons_build_directory=${nestedBuild}",
            "-Pmoons_jar_output_directory=universal/26.1",
            "--console=plain", "--no-daemon"
    doLast {
        if (!nestedPayload.isFile()) {
            throw new GradleException("Nested 26.1 payload was not produced: ${nestedPayload}")
        }
        def destination = publishedPayload.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                nestedPayload.toPath(),
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}
universalPayload26_1.configure {
    mustRunAfter apiJar, bridgeDll
}

def universalPayload26_2 = tasks.register("universalPayload26_2", Exec) {
    group = "build"
    description = "Builds the Minecraft 26.2 payload for the universal injector."
    dependsOn universalPayload26_1
    def nestedBuild = "${nestedPayloadBuildRoot}/26.2"
    def nestedPayload = file("${nestedBuild}/universal/26.2/moons.jar")
    def publishedPayload = layout.buildDirectory.file("universal/26.2/moons.jar")
    workingDir project.projectDir
    commandLine nestedGradleExecutable.absolutePath,
            "moonsJar",
            "-Pminecraft_version=26.2",
            "-Pmoons_build_directory=${nestedBuild}",
            "-Pmoons_jar_output_directory=universal/26.2",
            "--console=plain", "--no-daemon"
    doLast {
        if (!nestedPayload.isFile()) {
            throw new GradleException("Nested 26.2 payload was not produced: ${nestedPayload}")
        }
        def destination = publishedPayload.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                nestedPayload.toPath(),
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

def universalPayloadPatch = tasks.register("universalPayloadPatch", Exec) {
    group = "build"
    description = "Builds a compact entry-level 26.2 overlay over the 26.1 payload."
    dependsOn universalPayload26_2

    def source = layout.projectDirectory.file("tools/PayloadPatchBuilder.java")
    def payload26_1 = layout.buildDirectory.file("universal/26.1/moons.jar")
    def payload26_2 = layout.buildDirectory.file("universal/26.2/moons.jar")
    def output = layout.buildDirectory.file("universal/moons-26.2.patch.zip")
    inputs.file(source)
    inputs.file(payload26_1)
    inputs.file(payload26_2)
    outputs.file(output)

    doFirst {
        output.get().asFile.parentFile.mkdirs()
        def javaExecutable = new File(locateJdkHome(), "bin/java.exe")
        executable javaExecutable.absolutePath
        args(
                source.asFile.absolutePath,
                payload26_1.get().asFile.absolutePath,
                payload26_2.get().asFile.absolutePath,
                output.get().asFile.absolutePath
        )
    }
}

def moonsHwidExe = tasks.register("moonsHwidExe", Exec) {
    group = "build"
    description = "Builds the out-of-process Windows hardware ID helper."

    def source = layout.projectDirectory.file("src/hwid/csharp/MoonsHardwareId.cs")
    def generator = layout.projectDirectory.file("src/shared-csharp/HardwareIdGenerator.cs")
    def output = layout.buildDirectory.file("dist/moons-hwid.exe")
    inputs.file(source)
    inputs.file(generator)
    outputs.file(output)

    doFirst {
        if (!System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")) {
            throw new GradleException("moonsHwidExe currently requires Windows")
        }
        def compiler = [
                file("C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe"),
                file("C:/Windows/Microsoft.NET/Framework/v4.0.30319/csc.exe")
        ].find { it.isFile() }
        if (compiler == null) {
            throw new GradleException("Windows C# compiler was not found; install .NET Framework 4.x")
        }

        output.get().asFile.parentFile.mkdirs()
        executable compiler.absolutePath
        args(
                "/nologo",
                "/target:winexe",
                "/optimize+",
                "/platform:x64",
                "/reference:System.Management.dll",
                "/reference:System.Windows.Forms.dll",
                "/out:${output.get().asFile.absolutePath}",
                generator.asFile.absolutePath,
                source.asFile.absolutePath
        )
    }
}

def moonsExe = tasks.register("moonsExe", Exec) {
    group = "build"
    description = "Builds one Windows injector containing a 26.1 base and 26.2 overlay."
    dependsOn universalPayloadPatch, apiJar, bridgeDll, moonsHwidExe

    def source = layout.projectDirectory.file("src/launcher/csharp/MoonsExeLauncher.cs")
    def hardwareIdGenerator = layout.projectDirectory.file("src/shared-csharp/HardwareIdGenerator.cs")
    def payload26_1 = layout.buildDirectory.file("universal/26.1/moons.jar")
    def payload26_2Patch = layout.buildDirectory.file("universal/moons-26.2.patch.zip")
    def bootstrapApi = layout.buildDirectory.file("moons-payload/26.1/moons-api.jar")
    def bridge = layout.buildDirectory.file("dist/26.1/moons-bridge.dll")
    def output = layout.buildDirectory.file("dist/moons.exe")
    inputs.file(source)
    inputs.file(hardwareIdGenerator)
    inputs.file(payload26_1)
    inputs.file(payload26_2Patch)
    inputs.file(bootstrapApi)
    inputs.file(bridge)
    outputs.file(output)

    doFirst {
        if (!System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")) {
            throw new GradleException("moonsExe currently requires Windows")
        }
        def compiler = [
                file("C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe"),
                file("C:/Windows/Microsoft.NET/Framework/v4.0.30319/csc.exe")
        ].find { it.isFile() }
        if (compiler == null) {
            throw new GradleException("Windows C# compiler was not found; install .NET Framework 4.x")
        }

        output.get().asFile.parentFile.mkdirs()
        executable compiler.absolutePath
        args(
                "/nologo",
                "/target:winexe",
                "/optimize+",
                "/platform:x64",
                "/reference:System.Windows.Forms.dll",
                "/reference:System.Management.dll",
                "/reference:System.IO.Compression.dll",
                "/reference:System.IO.Compression.FileSystem.dll",
                "/out:${output.get().asFile.absolutePath}",
                "/resource:${payload26_1.get().asFile.absolutePath},Moons.Payload.26_1.jar",
                "/resource:${payload26_2Patch.get().asFile.absolutePath},Moons.Payload.26_2.patch",
                "/resource:${bootstrapApi.get().asFile.absolutePath},Moons.Api.jar",
                "/resource:${bridge.get().asFile.absolutePath},Moons.Bridge.dll",
                hardwareIdGenerator.asFile.absolutePath,
                source.asFile.absolutePath
        )
    }
}

tasks.register("verifyJvmtiBridge", Exec) {
    group = "verification"
    description = "Injects the JNI/JVMTI bridge into the fake Minecraft JVM and verifies ASM hooks."
    dependsOn tasks.named("moonsJar"), tasks.named("injectorFixtureJar"), bridgeDll
    onlyIf { windowsHost }

    doFirst {
        def javaExecutable = new File(locateJdkHome(), "bin/java.exe")
        commandLine(
                "powershell.exe",
                "-NoProfile",
                "-ExecutionPolicy", "Bypass",
                "-File", file("scripts/verify-jvmti-bridge.ps1").absolutePath,
                "-Java", javaExecutable.absolutePath,
                "-Fixture", layout.buildDirectory.file(
                        "${versionedTestDirectory}/moons-injector-fixture.jar").get().asFile.absolutePath,
                "-Dll", nativeBridgeDistDll.get().asFile.absolutePath,
                "-Payload", tasks.named("moonsJar", Jar).get()
                        .archiveFile.get().asFile.absolutePath
        )
    }
}

tasks.register("verifyJvmtiBridgeSystemLoader", Exec) {
