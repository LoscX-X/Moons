import java.util.regex.Pattern

plugins {
    id 'net.fabricmc.fabric-loom' version "1.17.19"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20'
    id 'org.jetbrains.compose' version '1.10.3'
    id 'com.gradleup.shadow' version '9.2.2'
}

repositories {
    mavenCentral()
    google()
    maven { url = uri("https://maven.pkg.jetbrains.space/public/p/compose/dev") }
}

configurations {
    composeEmbedded
}

def selectedMinecraftVersion = project.minecraft_version.toString()
def supportedMinecraftVersions = [
        "26.1.2": "26_1",
        "26.2"  : "26_2"
]
def selectedVersionDirectory = supportedMinecraftVersions[selectedMinecraftVersion]
if (selectedVersionDirectory == null) {
    throw new GradleException("Unsupported Minecraft version ${selectedMinecraftVersion}; expected one of "
            + supportedMinecraftVersions.keySet().join(", "))
}
// Universal payloads are nested Gradle builds. Give each nested invocation an
// isolated output tree so 26.1/26.2 Kotlin classes and CMake artifacts can
// never overwrite one another while the other compiler is still reading them.
def isolatedBuildDirectory = providers.gradleProperty("moons_build_directory").orNull
if (isolatedBuildDirectory != null && !isolatedBuildDirectory.isBlank()) {
    layout.buildDirectory.set(file(isolatedBuildDirectory))
}
def versionedDistDirectory = "dist/${selectedVersionDirectory}"
def versionedPayloadDirectory = "moons-payload/${selectedVersionDirectory}"
def versionedTestDirectory = "moons-test/${selectedVersionDirectory}"
// A running injected JVM can keep its agent JAR open on Windows.  Verification
// builds may select an internal staging directory instead of requiring the user
// to close Minecraft just so Gradle can overwrite the public artifact.
def moonsJarOutputDirectory = providers.gradleProperty("moons_jar_output_directory")
        .getOrElse(versionedDistDirectory)

sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    api {
        java.setSrcDirs(["src/api/java"])
        resources.setSrcDirs(["src/api/resources"])
    }
    agent {
        java.setSrcDirs([
                "src/agent/java",
                "src/versions/${selectedVersionDirectory}/agent"
        ])
        resources.setSrcDirs(["src/agent/resources"])
        compileClasspath += sourceSets.api.output
    }
    runtime {
        java.setSrcDirs(["src/runtime/java"])
        resources.setSrcDirs(["src/runtime/resources"])
        compileClasspath += sourceSets.api.output
    }
    features {
        java.setSrcDirs(["src/features/java"])
        resources.setSrcDirs(["src/features/resources"])
        compileClasspath += sourceSets.api.output + sourceSets.runtime.output
    }
    injectorTest {
        java.setSrcDirs(["src/injectorTest/java"])
        resources.setSrcDirs(["src/injectorTest/resources"])
        compileClasspath += sourceSets.agent.output + sourceSets.runtime.output + sourceSets.api.output + configurations.agentRuntimeClasspath
        runtimeClasspath += sourceSets.agent.output + sourceSets.runtime.output + sourceSets.api.output + configurations.agentRuntimeClasspath
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
}

configurations.named("clientImplementation") {
    extendsFrom configurations.composeEmbedded
}

sourceSets.client.java.setSrcDirs([
        "src/shared-client/java",
        "src/versions/${selectedVersionDirectory}/client/java"
])
sourceSets.client.kotlin.setSrcDirs([
        "src/shared-client/kotlin",
        "src/versions/${selectedVersionDirectory}/client/kotlin"
])
sourceSets.client.resources.setSrcDirs([
        "src/shared-client/resources",
        "src/versions/${selectedVersionDirectory}/client/resources"
])

tasks.named("processFeaturesResources") {
    inputs.property("minecraftVersion", selectedMinecraftVersion)
    filesMatching("META-INF/moons-module.properties") {
        expand(minecraftVersion: selectedMinecraftVersion)
    }
}

def featureMetadataFile = layout.buildDirectory.file(
        "resources/features/META-INF/moons-module.properties")
def verifyFeatureMetadata = tasks.register("verifyFeatureMetadata") {
    group = "verification"
    description = "Verifies the expanded feature module metadata."
    dependsOn tasks.named("processFeaturesResources")
    inputs.file(featureMetadataFile)

    doLast {
        def metadataFile = featureMetadataFile.get().asFile
        if (!metadataFile.isFile()) {
            throw new GradleException("Feature metadata was not produced: ${metadataFile}")
        }

        def metadataText = metadataFile.getText("UTF-8")
        if (metadataText.contains('${')) {
            throw new GradleException(
                    "Feature metadata contains an unexpanded placeholder: ${metadataFile}")
        }

        def metadata = new Properties()
        metadataFile.withInputStream { metadata.load(it) }
        def metadataMinecraftVersion = metadata.getProperty("minecraft")
        if (metadataMinecraftVersion != selectedMinecraftVersion) {
            throw new GradleException(
                    "Feature metadata minecraft version ${metadataMinecraftVersion} does not match "
                            + "selected version ${selectedMinecraftVersion}")
        }
    }
}

// Loom creates the split client source set after the Kotlin plugin has applied.
// Explicitly expose its Java roots to K2 so Kotlin can resolve the existing
// module registry and Minecraft screen classes during joint compilation.
tasks.named("compileClientKotlin", org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    source(sourceSets.client.java)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Compose renders as an independent final-frame overlay in the GLFW framebuffer.
    // These artifacts are shaded into the hot-loaded feature payload below.
    composeEmbedded(compose.desktop.currentOs)
    composeEmbedded(compose.material3)

    // The standalone injector is deliberately isolated from Fabric/Minecraft.
    // Its only non-JDK dependency is ASM, which is folded into moons.jar.
    agentImplementation "org.ow2.asm:asm:9.10.1"
    agentImplementation "org.ow2.asm:asm-tree:9.10.1"
    agentImplementation "org.ow2.asm:asm-util:9.10.1"
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

tasks.named("compileAgentJava", JavaCompile).configure {
    options.compilerArgs.addAll(["--add-modules", "jdk.attach"])
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    enabled = false
}

def apiJar = tasks.register("apiJar", Jar) {
    archiveFileName = "moons-api.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    from sourceSets.api.output
}

def runtimeJar = tasks.register("runtimeJar", Jar) {
    archiveFileName = "moons-runtime.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    from sourceSets.runtime.output
}

sourceSets.client.compileClasspath += sourceSets.api.output
sourceSets.features.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath

def featuresJar = tasks.register("featuresJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveFileName = "moons-core-features.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    dependsOn tasks.named("clientClasses")
    configurations = [project.configurations.composeEmbedded]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    exclude "META-INF/INDEX.LIST"
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    exclude "META-INF/versions/*/module-info.class", "module-info.class"
    from sourceSets.features.output
    from sourceSets.client.output
}

tasks.register("injectorFixtureJar", Jar) {
    archiveFileName = "moons-injector-fixture.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedTestDirectory)
    dependsOn tasks.named("injectorTestClasses")
    from sourceSets.injectorTest.output
    manifest {
        attributes("Main-Class": "com.blanoir.moons.fixture.AttachTarget")
    }
}

def nativeAgentFixtureJar = tasks.register("nativeAgentFixtureJar", Jar) {
    archiveFileName = "moons-native-agent-fixture.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedTestDirectory)
    dependsOn tasks.named("injectorTestClasses")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.injectorTest.output
    from({
        configurations.agentRuntimeClasspath
                .findAll { it.isFile() }
                .collect { zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        exclude "module-info.class"
    }
    manifest {
        attributes("Main-Class": "com.blanoir.moons.nativebridge.NativeAgentVerification")
    }
}

tasks.register("verifyMinecraftTransformers", JavaExec) {
    group = "verification"
    description = "Transforms and bytecode-verifies every supported hook against the actual Minecraft JAR."
    dependsOn tasks.named("injectorTestClasses")
    classpath = sourceSets.injectorTest.runtimeClasspath
    mainClass = "com.blanoir.moons.agent.core.TransformerVerification"
    doFirst {
        def minecraftJars = sourceSets.client.compileClasspath.files.findAll {
            it.name.toLowerCase(Locale.ROOT).startsWith("minecraft-")
                    && it.name.toLowerCase(Locale.ROOT).endsWith(".jar")
        }
        if (minecraftJars.isEmpty()) {
            throw new GradleException("Unable to locate the Loom Minecraft JARs")
        }
        def sodiumJar = file("libs/sodium.jar")
        if (sodiumJar.isFile()) minecraftJars.add(sodiumJar)
        args = minecraftJars.collect { it.absolutePath }
    }
}

tasks.register("verifyRuntimeLifecycle", JavaExec) {
    group = "verification"
    description = "Verifies deterministic subscription and module resource cleanup."
    dependsOn tasks.named("injectorTestClasses")
    classpath = sourceSets.injectorTest.runtimeClasspath
    mainClass = "com.blanoir.moons.runtime.LifecycleVerification"
}

tasks.named("check").configure {
    dependsOn tasks.named("clientClasses")
    dependsOn tasks.named("featuresClasses")
    dependsOn verifyFeatureMetadata
    dependsOn tasks.named("verifyMinecraftTransformers")
    dependsOn tasks.named("verifyRuntimeLifecycle")
}

tasks.register("moonsJar", Jar) {
    group = "build"
    description = "Builds the single-file executable Attach agent distribution."
    dependsOn apiJar, runtimeJar, featuresJar, tasks.named("agentClasses")

    archiveFileName = "moons.jar"
    destinationDirectory = layout.buildDirectory.dir(moonsJarOutputDirectory)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.agent.output
    from({
        configurations.agentRuntimeClasspath
                .findAll { it.isFile() }
                .collect { zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        exclude "module-info.class"
    }
    into("META-INF/moons/bootstrap") {
        from(apiJar.flatMap { it.archiveFile })
    }
    into("META-INF/moons/runtime") {
        from(runtimeJar.flatMap { it.archiveFile })
    }
    into("META-INF/moons/modules") {
        from(featuresJar.flatMap { it.archiveFile })
    }

    manifest {
        attributes(
                "Main-Class": "com.blanoir.moons.agent.launch.MoonsLauncher",
                "Premain-Class": "com.blanoir.moons.agent.MoonsAgent",
                "Agent-Class": "com.blanoir.moons.agent.MoonsAgent",
                "Can-Redefine-Classes": "true",
                "Can-Retransform-Classes": "true",
                "Implementation-Title": "Moons single-file injector",
                "Implementation-Version": project.version
        )
    }
}

def windowsHost = System.getProperty("os.name")
        .toLowerCase(Locale.ROOT)
        .contains("windows")
def nativeAgentSourceDirectory = layout.projectDirectory.dir("native-agent")
def nativeAgentBuildDirectory = layout.buildDirectory.dir("native-agent")
def nativeAgentBuiltDll = nativeAgentBuildDirectory.map { it.file("out/moons-native.dll") }
def nativeAgentDistDll = layout.buildDirectory.file("${versionedDistDirectory}/moons-native.dll")
def nativeAgentDistApiJar = layout.buildDirectory.file("${versionedDistDirectory}/moons-api.jar")

def locateCmake = {
    def executableName = windowsHost ? "cmake.exe" : "cmake"
    def candidates = []
    def pathValue = System.getenv("PATH")
    if (pathValue != null) {
        pathValue.split(Pattern.quote(File.pathSeparator)).each {
            if (!it.isBlank()) candidates.add(file(it).toPath().resolve(executableName).toFile())
        }
    }
    if (windowsHost) {
        candidates.add(file("C:/Program Files/CMake/bin/cmake.exe"))
        candidates.add(file("C:/Program Files (x86)/CMake/bin/cmake.exe"))

        def vswhere = file("C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe")
        if (vswhere.isFile()) {
            def process = new ProcessBuilder(
                    vswhere.absolutePath,
                    "-latest",
                    "-products", "*",
                    "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
                    "-property", "installationPath"
            ).redirectErrorStream(true).start()
            def installation = process.inputStream.getText("UTF-8").trim()
            if (process.waitFor() == 0 && !installation.isBlank()) {
                candidates.add(file(installation).toPath().resolve(
                        "Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe"
                ).toFile())
            }
        }
    }
    def cmake = candidates.find { it.isFile() }
    if (cmake == null) {
        throw new GradleException("CMake was not found; install the Visual Studio C++ CMake tools")
    }
    return cmake
}

def locateJdkHome = {
    def candidates = [
            file(System.getProperty("java.home")),
            project.hasProperty("org.gradle.java.home")
                    ? file(project.property("org.gradle.java.home"))
                    : null
    ].findAll { it != null }
    def jdk = candidates.find { new File(it, "include/jni.h").isFile() }
    if (jdk == null) {
        throw new GradleException("The Gradle JVM must be a JDK containing JNI/JVMTI headers")
    }
    return jdk
}

def configureNativeAgent = tasks.register("configureNativeAgent", Exec) {
    group = "build"
    description = "Configures the optional Windows JVMTI startup agent."
    onlyIf { windowsHost }
    inputs.files(fileTree(nativeAgentSourceDirectory) {
        include "CMakeLists.txt", "src/**/*.cpp", "src/**/*.h"
    })
    outputs.file(nativeAgentBuildDirectory.map { it.file("CMakeCache.txt") })

    doFirst {
        def cmake = locateCmake()
        def jdkHome = locateJdkHome()
        nativeAgentBuildDirectory.get().asFile.mkdirs()
        commandLine(
                cmake.absolutePath,
                "-S", nativeAgentSourceDirectory.asFile.absolutePath,
                "-B", nativeAgentBuildDirectory.get().asFile.absolutePath,
                "-G", "Visual Studio 17 2022",
                "-A", "x64",
                "-DJAVA_HOME=${jdkHome.absolutePath}"
        )
    }
}

def compileNativeAgent = tasks.register("compileNativeAgent", Exec) {
    group = "build"
    description = "Builds moons-native.dll using the discovered Visual Studio toolchain."
    dependsOn configureNativeAgent
    onlyIf { windowsHost }
    inputs.files(fileTree(nativeAgentSourceDirectory) {
        include "CMakeLists.txt", "src/**/*.cpp", "src/**/*.h"
    })
    outputs.file(nativeAgentBuiltDll)

    doFirst {
        commandLine(
                locateCmake().absolutePath,
                "--build", nativeAgentBuildDirectory.get().asFile.absolutePath,
                "--config", "Release",
                "--target", "moons-native"
        )
    }
}

def nativeAgentDll = tasks.register("nativeAgentDll") {
    group = "build"
    description = "Copies the optional JVMTI startup agent into build/dist."
    dependsOn compileNativeAgent
    onlyIf { windowsHost }
    inputs.file(nativeAgentBuiltDll)
    outputs.file(nativeAgentDistDll)

    doLast {
        def source = nativeAgentBuiltDll.get().asFile.toPath()
        def destination = nativeAgentDistDll.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                source,
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

def nativeAgentApiJar = tasks.register("nativeAgentApiJar") {
    group = "build"
    description = "Copies the bootstrap-visible API required by the JVMTI distribution."
    dependsOn apiJar
    inputs.file(apiJar.flatMap { it.archiveFile })
    outputs.file(nativeAgentDistApiJar)

    doLast {
        def source = apiJar.get().archiveFile.get().asFile.toPath()
        def destination = nativeAgentDistApiJar.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                source,
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

def verifyNativeAgent = tasks.register("verifyNativeAgent", JavaExec) {
    group = "verification"
    description = "Verifies JVMTI -> JNI -> Java ASM -> JVMTI class-byte transformation."
    dependsOn nativeAgentDll, nativeAgentFixtureJar
    onlyIf { windowsHost }
    classpath = files(nativeAgentFixtureJar.flatMap { it.archiveFile })
    mainClass = "com.blanoir.moons.nativebridge.NativeAgentVerification"

    doFirst {
        def dll = nativeAgentDistDll.get().asFile.absolutePath
        def fixture = nativeAgentFixtureJar.get().archiveFile.get().asFile.absolutePath
        setJvmArgs([
                "-agentpath:${dll}=jar=${fixture};"
                        + "bridge=com.blanoir.moons.nativebridge.NativeAgentVerificationBridge;"
                        + "include=com/blanoir/moons/nativebridge/NativeAgentVerificationTarget"
        ])
    }
}

def verifyNativeMoonsTransformer = tasks.register("verifyNativeMoonsTransformer", JavaExec) {
    group = "verification"
    description = "Verifies that JVMTI runs the production Moons tick transformer and bridge."
    dependsOn nativeAgentDll, nativeAgentFixtureJar, tasks.named("moonsJar"), apiJar
    onlyIf { windowsHost }
    classpath = files(
            nativeAgentFixtureJar.flatMap { it.archiveFile },
            apiJar.flatMap { it.archiveFile }
    )
    mainClass = "com.blanoir.moons.nativebridge.NativeMoonsTransformerVerification"

    doFirst {
        def dll = nativeAgentDistDll.get().asFile.absolutePath
        def transformer = tasks.named("moonsJar", Jar).get().archiveFile.get().asFile.absolutePath
        def bootstrap = apiJar.get().archiveFile.get().asFile.absolutePath
        setJvmArgs([
                "-agentpath:${dll}=jar=${transformer};bootstrap=${bootstrap};"
                        + "include=net/minecraft/client/Minecraft"
        ])
    }
}

tasks.named("check").configure {
    dependsOn verifyNativeAgent
    dependsOn verifyNativeMoonsTransformer
}

