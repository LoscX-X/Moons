def portableConfigCheckExe = tasks.register('portableConfigVerificationExe', Exec) {
    onlyIf { temposBuild.windowsHost }
    dependsOn 'sessionFinalizerExe'
    def sources = files('src/tools/launcher/csharp/PortableConfig.cs',
            'src/tools/launcher/csharp/LegacyConfigMigration.cs', 'src/tools/launcher/csharp/LegacyModelMigration.cs')
    sources += fileTree('src/test/launcher') { include 'Portable*Verification.cs' }
    def output = layout.buildDirectory.file('verification/portable-parameters.exe')
    temposToolchains.csharpExe(delegate, output, sources, ['/target:exe', '/platform:x64',
            '/main:PortableConfigVerification', '/reference:System.Web.Extensions.dll'],
            ['Tempos.Finalizer.exe': layout.buildDirectory.file('generated/launcher/tempos-finalizer.exe')])
}

