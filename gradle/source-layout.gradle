/* Keep dependency boundaries and version overlays explicit as the project grows. */
def bootstrapSources = fileTree("src/bootstrap") {
    include "**/*.java", "**/*.kt"
}
def minecraftSources = fileTree("src/minecraft") {
    include "**/*.java", "**/*.kt"
}

tasks.register("verifySourceLayout") {
    group = "verification"
    description = "Checks bootstrap isolation and duplicate shared/version source identities."
    inputs.files(bootstrapSources, minecraftSources)
    inputs.property("supportedVersions", moonsBuild.supportedVersions)

    doLast {
        def violations = []
        def forbiddenImport = ~/(?m)^\s*import\s+(?:static\s+)?(?:net\.minecraft\.|com\.blanoir\.moons\.(?:client|features)\.)/
        bootstrapSources.each { source ->
            if (forbiddenImport.matcher(source.getText("UTF-8")).find()) {
                violations.add("Bootstrap must not import Minecraft, client, or feature classes: ${relativePath(source)}")
            }
        }

        // Compare each overlay with shared sources, never overlays with each
        // other: version-specific implementations may intentionally differ.
        moonsBuild.supportedVersions.each { minecraftVersion, directory ->
            ["java": "java", "kotlin": "kt"].each { language, extension ->
                def owners = [:]
                ["src/minecraft/shared/${language}",
                 "src/minecraft/versions/${directory}/client/${language}"].each { root ->
                    fileTree(root) { include "**/*.${extension}" }.each { source ->
                        def sourceText = source.getText("UTF-8")
                        def packageMatcher = sourceText =~ /(?m)^\s*package\s+([\w.]+)/
                        def packageName = packageMatcher.find() ? packageMatcher.group(1) : ""
                        // Equal package + source filename is an ambiguous
                        // overlay even when the directory layouts differ.
                        def identity = "${packageName}.${source.name}"
                        def previous = owners.putIfAbsent(identity, source)
                        if (previous != null) {
                            violations.add("Duplicate ${minecraftVersion} source ${identity}: "
                                    + "${relativePath(previous)} and ${relativePath(source)}")
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Source layout violations:\n - " + violations.sort().join("\n - "))
        }
    }
}
