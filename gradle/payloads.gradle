/* Production Java payload archives. */
def versionedPayloadDirectory = temposBuild.payloadDirectory
def temposJarOutputDirectory = temposBuild.jarOutputDirectory

jar {
    enabled = false
}

def apiJar = tasks.register("apiJar", Jar) {
    archiveFileName = "tempos-api.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    from sourceSets.api.output
}

def runtimeJar = tasks.register("runtimeJar", Jar) {
    archiveFileName = "tempos-runtime.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    from sourceSets.runtime.output
}

def uiDependenciesJar = tasks.register("uiDependenciesJar", temposPluginTypes.shadowJar) {
    group = null
    archiveFileName = "tempos-ui-runtime.jar"
    destinationDirectory = layout.buildDirectory.dir("dist/dependencies")
    configurations = [project.configurations.graphicsRuntime]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    exclude "META-INF/INDEX.LIST"
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    exclude "META-INF/versions/*/module-info.class", "module-info.class"
}

def clientModuleJar = tasks.register("clientModuleJar", Jar) {
    archiveFileName = "tempos-core-features.jar"
    destinationDirectory = layout.buildDirectory.dir(versionedPayloadDirectory)
    dependsOn tasks.named("clientClasses")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.client.output
}

tasks.register("temposJar", Jar) {
    group = "build"
    description = "Builds the Java payload loaded by the JNI/JVMTI bridge."
    dependsOn apiJar, runtimeJar, clientModuleJar, tasks.named("loaderClasses")

    archiveFileName = "tempos.jar"
    destinationDirectory = layout.buildDirectory.dir(temposJarOutputDirectory)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.loader.output
    from({
        // Kotlin belongs to the shared runtime URL, not the pre-runtime loader.
        // Fold in only the loader's ASM dependency family.
        configurations.loaderRuntimeClasspath.incoming.artifactView {
            componentFilter { component ->
                component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                        && component.group == 'org.ow2.asm'
            }
        }.files
                .findAll { it.isFile() }
                .collect { zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        exclude "module-info.class"
    }
    into("META-INF/tempos/bootstrap") {
        from(apiJar.flatMap { it.archiveFile })
    }
    into("META-INF/tempos/runtime") {
        from(runtimeJar.flatMap { it.archiveFile })
    }
    into("META-INF/tempos/modules") {
        from(clientModuleJar.flatMap { it.archiveFile })
    }

    manifest {
        attributes(
                "Implementation-Title": "Tempos JNI/JVMTI payload",
                "Implementation-Version": project.version
        )
    }
}
