<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e7">
  <title>顺风骑行 · 鹈鹕的海岸日记</title>
  <style>
    :root { color-scheme: light; --ink: #253b3c; --paper: #f3f0e7; --accent: #dc6647; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    main { width: min(1180px, 100%); margin: auto; padding: 38px 44px 24px; }
    header, footer, .controls, .brand { display: flex; align-items: center; }
    header { justify-content: space-between; padding-bottom: 25px; border-bottom: 1px solid #253b3c26; }
    .brand { gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .brand svg { width: 25px; height: 25px; }
    .edition { font: 11px ui-monospace, monospace; letter-spacing: 1.5px; }
    .intro { text-align: center; padding: 42px 0 0; position: relative; z-index: 1; }
    .eyebrow { font-size: 10px; letter-spacing: 4px; color: #8e6952; }
    h1 { font-size: clamp(32px, 5vw, 56px); letter-spacing: 7px; margin: 12px 0 13px; font-weight: 600; }
    .intro p { font-size: 13px; letter-spacing: 2px; color: #75817b; margin: 0; }
    .scene { display: block; width: 100%; height: auto; overflow: hidden; margin: -10px 0 0; }
    .controls { justify-content: center; gap: 22px; margin: 0 auto 30px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 1px solid #253b3c35; border-radius: 40px; background: transparent; color: var(--ink); min-width: 112px; min-height: 40px; padding: 10px 17px; cursor: pointer; font: inherit; font-size: 12px; }
    button:hover { background: #e7e7dc; }
    button:focus-visible, input:focus-visible { outline: 3px solid #dc6647; outline-offset: 5px; }
    .speed { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #78827c; }
    input { width: 100px; accent-color: var(--accent); cursor: pointer; }
    output { width: 32px; font: 11px ui-monospace, monospace; }
    footer { justify-content: space-between; border-top: 1px solid #253b3c26; padding-top: 20px; color: #7b847c; font-size: 10px; letter-spacing: 1px; }
    .live-dot { display: inline-block; background: #809a7e; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; }
    @media (max-width: 600px) { main { padding: 24px 18px; } .edition { font-size: 9px; } .intro { padding-top: 32px; } .intro p { font-size: 11px; letter-spacing: 1px; } .scene { width: calc(100% + 36px); margin: 10px -18px 16px; } .controls { gap: 12px; } footer { font-size: 9px; letter-spacing: 0; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="12" stroke="currentColor"/><path d="M5 17q5-9 10-3l8-2-7 6H9" stroke="currentColor" stroke-linejoin="round"/></svg>慢游俱乐部</div>
    <span class="edition">COASTAL DIARY / Nº 001</span>
  </header>
  <div class="intro">
    <span class="eyebrow">A LITTLE RIDE, A LITTLE JOY</span>
    <h1>今天，顺风。</h1>
    <p>跟着鹈鹕去海边，把日子踩得慢一点。</p>
  </div>

      <g id="road" stroke="#b9ab8e" stroke-width="2" stroke-linecap="round" opacity=".65"><path d="M-190 456h32M34 449h26m93 18h9m163-21h33m163 20h23m157-18h42m147 19h12m160-20h31m139 15h24"/></g>
      <g id="plants"><use href="#grass" x="158" y="414"/><use href="#grass" x="937" y="424"/><use href="#grass" x="1180" y="415"/><g transform="translate(984 411)" fill="#d29269"><ellipse rx="10" ry="4"/><ellipse cx="17" cy="1" rx="6" ry="3"/></g></g>

        <path id="far-foot" d="M536 389h26" fill="none" stroke="#b97a43" stroke-width="8" stroke-linecap="round"/>
        <g id="bike">
          <g transform="translate(399 351)"><circle r="77" fill="#f3f0e7" stroke="#2e4341" stroke-width="9"/><circle r="72" fill="none" stroke="#d1cdbc" stroke-width="3"/><g id="rear-spokes"><use href="#spokes"/></g><circle r="6" fill="#344a46"/></g>
          <g transform="translate(670 351)"><circle r="77" fill="#f3f0e7" stroke="#2e4341" stroke-width="9"/><circle r="72" fill="none" stroke="#d1cdbc" stroke-width="3"/><g id="front-spokes"><use href="#spokes"/></g><circle r="6" fill="#344a46"/></g>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M321 341a79 79 0 0 1 150-24M593 317a79 79 0 0 1 153 18" stroke="#819c89" stroke-width="5"/>
            <path d="M399 351l79-113 51 113H399l-1-1m80-112 160 1-109 112m109-112 32 112" stroke="#b94e38" stroke-width="9"/>
            <path d="M479 239l50 112 106-110" stroke="#e37f59" stroke-width="3"/>
            <path d="M478 239l-7-30M638 239l-13-51q-3-13 13-13h24" stroke="#3e5550" stroke-width="7"/>
            <path d="M651 175h23" stroke="#c39160" stroke-width="10"/>
            <path d="M647 181q29 52 10 105" stroke="#657c72" stroke-width="2"/>
            <path d="M521 337l-123 6q-13 8 0 16l126 5" stroke="#7c8c7c" stroke-width="2"/>
          </g>
          <path d="M449 204q-3-8 9-8h37q11 0 13 9-24 9-59-1" fill="#344b44"/>
          <circle cx="529" cy="351" r="19" fill="#e2d9bd" stroke="#526c5e" stroke-width="3"/>
          <g id="chainring" transform="translate(529 351)" fill="none" stroke="#97a28b" stroke-width="2"><circle r="12"/><path d="M-12 0h24M0-12v24"/></g>
          <path id="crank" d="M510 330L548 372" stroke="#344c44" stroke-width="5" stroke-linecap="round"/>
          <path id="far-pedal" d="M538 372h20" stroke="#344c44" stroke-width="5" stroke-linecap="round"/>
        </g>
        <!-- Pelican: tail, soft body, long curved neck, and large throat pouch. -->
        <path d="M453 216q-36 2-57-23 30 2 47 4-20-12-23-27 29 8 53 31" fill="#e5e5d7" stroke="#344b44" stroke-width="3" stroke-linejoin="round"/>
        <path d="M450 192C464 173 485 172 516 174 540 171 550 155 545 135 536 107 544 76 568 70 594 64 613 80 613 101 613 126 590 147 591 174 593 216 566 248 519 249 482 250 454 231 450 192Z" fill="#fbfaf0" stroke="#344b44" stroke-width="3"/>
        <path d="M548 141q15 31-3 62c-14 22-41 31-66 22 26 27 71 25 96-8 17-22 17-42 15-54 0-21 12-41 18-52-16 8-26 26-33 49-6 17-13 24-23 27 10-18 8-32-4-46" fill="#e2e6d9"/>
        <path id="wing" d="M472 186C499 170 531 185 560 209 539 233 500 237 478 217q-14-14-6-31Z" fill="#efeee1" stroke="#344b44" stroke-width="2.5"/>
        <path d="M484 202q22 18 49 14M482 211q19 15 37 13" fill="none" stroke="#bac6b7" stroke-width="2" stroke-linecap="round"/>
        <path id="near-leg" d="M518 239L556 283 529 323" fill="none" stroke="#d69b50" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="near-foot" d="M520 323h28l-7-6" fill="none" stroke="#d69b50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="near-pedal" d="M519 330h20" stroke="#344c44" stroke-width="5" stroke-linecap="round"/>
        <path d="M529 194q42 16 64 4l56-22" fill="none" stroke="#344b44" stroke-width="17" stroke-linecap="round"/>
        <path d="M529 191q42 16 64 4l56-22" fill="none" stroke="#f8f7ec" stroke-width="12" stroke-linecap="round"/>
        <path d="M644 172l7 5m-1-8 7 5" stroke="#344b44" stroke-width="2" stroke-linecap="round"/>
        <g id="scarf-tail"><path d="M555 155Q521 143 496 158L469 145l9 20-14 9q37 5 64-8l31 6" fill="#cf6347" stroke="#a54e39" stroke-width="2"/><path d="M481 161q24 5 42-2" fill="none" stroke="#ed9970" stroke-width="3"/></g>
        <path d="M549 149q18 13 41 5l-1 14q-20 7-38-5Z" fill="#d96a48" stroke="#aa513b" stroke-width="2"/>
        <path d="M604 104L737 111Q692 153 634 141q-25-6-30-37Z" fill="url(#pouch)" stroke="#344b44" stroke-width="2.5"/>
        <path d="M603 99q56-6 140 11l-138 6Z" fill="#f1bd66" stroke="#344b44" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M620 121q19 15 49 12" fill="none" stroke="#f3ca86" stroke-width="3" stroke-linecap="round"/>
        <circle cx="588" cy="98" r="5" fill="#263f3c"/><circle cx="589.5" cy="96.5" r="1.5" fill="white"/>
        <path d="M579 86q7-4 13-1" fill="none" stroke="#344b44" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="594" cy="113" rx="7" ry="4" fill="#e8b69b" opacity=".6"/>
        <g id="hat"><path d="M544 78q-2-28 25-29 26-1 29 28Z" fill="#6f927a" stroke="#344b44" stroke-width="2.5"/><path d="M539 77q34-10 70-1 8 5-4 7l-63 1q-12-2-3-7" fill="#557a63" stroke="#344b44" stroke-width="2.5"/><path d="M563 54q-9 8-8 15" fill="none" stroke="#a6b798" stroke-width="3" stroke-linecap="round"/></g>
      </g>
      <g id="wind" stroke="#93a797" stroke-width="2" fill="none" stroke-linecap="round"><path d="M309 197h55m-77 19h40m-11 26h42"/></g>
      <rect x="24" y="25" width="1052" height="459" fill="url(#grain)" pointer-events="none"/>

    <g fill="#8d9688" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2"><text x="47" y="514">24° C / 海风轻轻</text><text x="1053" y="514" text-anchor="end">NO HURRY. JUST PEDAL.</text></g>

  <div class="controls">
    <button id="toggle" type="button" aria-label="暂停动画"><span id="play-icon" aria-hidden="true">Ⅱ</span><span id="play-label">歇一会儿</span></button>
    <label class="speed" for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speed-value" for="speed">1.0×</output></label>
  </div>
  <footer><span><i class="live-dot"></i>给忙碌的世界，一点闲暇</span><span>SVG 动画 · 骑向好心情</span></footer>
</main>
<script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const ids = ['rider', 'rear-spokes', 'front-spokes', 'chainring', 'crank', 'near-leg', 'far-leg', 'near-foot', 'far-foot', 'near-pedal', 'far-pedal', 'scarf-tail', 'clouds', 'plants', 'road', 'ripples', 'wind', 'bird-one', 'bird-two', 'shadow'];
    const parts = Object.fromEntries(ids.map(id => [id, $(id)]));
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let running = !reducedMotion.matches;
    let speed = 1, elapsed = 0, previous = null;
    const transform = (id, value) => parts[id].setAttribute('transform', value);
    const path = (id, value) => parts[id].setAttribute('d', value);
    // Two fixed-length leg segments meet at a knee, keeping each foot on its pedal.
    function leg(id, hip, foot, upper, lower) {
      const dx = foot.x - hip.x, dy = foot.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const height = Math.sqrt(Math.max(0, upper * upper - along * along));
      const knee = { x: hip.x + along * dx / distance + height * dy / distance, y: hip.y + along * dy / distance - height * dx / distance };
      path(id, `M${hip.x} ${hip.y}L${knee.x} ${knee.y} ${foot.x} ${foot.y}`);
    }
    function draw(t) {
      const angle = t * 2.8;
      const degrees = angle * 180 / Math.PI;
      transform('rider', `translate(0 ${Math.sin(angle * 2) * 1.4})`);
      transform('rear-spokes', `rotate(${degrees * 1.7})`);
      transform('front-spokes', `rotate(${degrees * 1.7})`);
      transform('chainring', `translate(529 351) rotate(${degrees})`);
      const near = {x: 529 + Math.cos(angle) * 28, y: 351 + Math.sin(angle) * 28};
      const far = {x: 529 - Math.cos(angle) * 28, y: 351 - Math.sin(angle) * 28};
      path('crank', `M${near.x} ${near.y}L${far.x} ${far.y}`);
      for (const [side, point] of [['near', near], ['far', far]]) {
        leg(`${side}-leg`, {x: side === 'near' ? 518 : 509, y: 238}, {x: point.x - 5, y: point.y - 8}, 76, 74);
        path(`${side}-foot`, `M${point.x - 13} ${point.y - 5}h26l-6-5`);
        path(`${side}-pedal`, `M${point.x - 11} ${point.y + 1}h22`);
      }
      transform('scarf-tail', `rotate(${Math.sin(angle * 2.5) * 5} 555 158)`);
      // Repeated copies make the scenery loop seamlessly at each layer's speed.
      for (const [id, velocity, period] of [['clouds', 12, 1200], ['plants', 108, 1250], ['road', 108, 1250], ['ripples', 23, 1250]]) {
        const offset = (t * velocity) % period;
        transform(id, `translate(${-offset} 0)`);
        document.getElementById(`${id}-repeat`).setAttribute('transform', `translate(${period - offset} 0)`);
      }
      parts.wind.setAttribute('opacity', String(.4 + Math.sin(angle * 2) * .2));
      transform('bird-one', `translate(0 ${Math.sin(t * 1.4) * 4})`);
      transform('bird-two', `translate(0 ${Math.sin(t * 1.4 + 2) * 3})`);
      parts.shadow.setAttribute('rx', String(204 + Math.sin(angle * 2) * 2));
    }
    for (const id of ['clouds', 'plants', 'road', 'ripples']) {
      const copy = parts[id].cloneNode(true);
      copy.id = `${id}-repeat`;
      parts[id].after(copy);
    }
    function updateControl() {
      $('play-icon').textContent = running ? 'Ⅱ' : '▶';
      $('play-label').textContent = running ? '歇一会儿' : '继续骑行';
      $('toggle').setAttribute('aria-label', running ? '暂停动画' : '播放动画');
    }
    $('toggle').addEventListener('click', () => { running = !running; updateControl(); });
    $('speed').addEventListener('input', event => {
      speed = Number(event.target.value);
      $('speed-value').value = `${speed.toFixed(1)}×`;
    });
    reducedMotion.addEventListener('change', event => { running = !event.matches; updateControl(); });
    document.addEventListener('visibilitychange', () => { previous = null; });
    function frame(now) {
      if (previous !== null && running) elapsed += Math.min((now - previous) / 1000, .05) * speed;
      previous = now;
      draw(elapsed);
      requestAnimationFrame(frame);
    }
    updateControl();
    draw(0);
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
