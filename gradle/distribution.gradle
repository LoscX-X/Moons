def universalPayloadPatch = tasks.register("universalPayloadPatch", Exec) {
    group = "build"
    description = "Builds a compact entry-level 26.2 overlay over the 26.1 payload."
    dependsOn universalPayload26_2

    def source = layout.projectDirectory.file("tools/PayloadPatchBuilder.java")
    def payload26_1 = layout.buildDirectory.file("universal/26.1/moons.jar")
    def payload26_2 = layout.buildDirectory.file("universal/26.2/moons.jar")
    def output = layout.buildDirectory.file("universal/moons-26.2.patch.zip")
    inputs.file(source)
    inputs.file(payload26_1)
    inputs.file(payload26_2)
    outputs.file(output)

    doFirst {
        output.get().asFile.parentFile.mkdirs()
        def javaExecutable = new File(locateJdkHome(), "bin/java.exe")
        executable javaExecutable.absolutePath
        args(
                source.asFile.absolutePath,
                payload26_1.get().asFile.absolutePath,
                payload26_2.get().asFile.absolutePath,
                output.get().asFile.absolutePath
        )
    }
}

