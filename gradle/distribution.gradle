def moonsHwidExe = tasks.register("moonsHwidExe", Exec) {
    group = "build"
    description = "Builds the out-of-process Windows hardware ID helper."

    def source = layout.projectDirectory.file("src/tools/hwid/csharp/MoonsHardwareId.cs")
    def generator = layout.projectDirectory.file("src/tools/shared/HardwareIdGenerator.cs")
    def hashing = layout.projectDirectory.file("src/tools/shared/Hashing.cs")
    def output = layout.buildDirectory.file("dist/moons-hwid.exe")
    inputs.file(source)
    inputs.file(generator)
    inputs.file(hashing)
    outputs.file(output)

    doFirst {
        if (!System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")) {
            throw new GradleException("moonsHwidExe currently requires Windows")
        }
        def compiler = locateCSharpCompiler()

        output.get().asFile.parentFile.mkdirs()
        executable compiler.absolutePath
        args(
                "/nologo",
                "/target:winexe",
                "/optimize+",
                "/platform:x64",
                "/reference:System.Management.dll",
                "/reference:System.Windows.Forms.dll",
                "/out:${output.get().asFile.absolutePath}",
                generator.asFile.absolutePath,
                hashing.asFile.absolutePath,
                source.asFile.absolutePath
        )
    }
}

def uiRuntime = uiDependenciesJar.flatMap { it.archiveFile }
def uiMetadata = layout.buildDirectory.file("generated/launcher/ui-runtime.properties")
def uiChecksum = uiRuntime.map { file("${it.asFile.absolutePath}.sha256") }
def uiDownloadUrl = providers.gradleProperty("moons_ui_download_url").getOrElse("").trim()

def launcherUiMetadata = tasks.register("launcherUiMetadata") {
    dependsOn uiDependenciesJar
    inputs.file(uiRuntime)
    inputs.property("moonsUiDownloadUrl", uiDownloadUrl)
    outputs.file(uiMetadata)
    outputs.file(uiChecksum)
    doLast {
        if (uiDownloadUrl.contains("\r") || uiDownloadUrl.contains("\n")) {
            throw new GradleException("moons_ui_download_url must be a single URL")
        }
        def runtimeFile = uiRuntime.get().asFile
        def sha = java.security.MessageDigest.getInstance("SHA-256")
                .digest(java.nio.file.Files.readAllBytes(runtimeFile.toPath()))
                .collect { String.format("%02x", it & 0xff) }.join()
        def metadataFile = uiMetadata.get().asFile
        metadataFile.parentFile.mkdirs()
        metadataFile.setText("format=1\nurl=${uiDownloadUrl}\nsha256=${sha}\nsize=${runtimeFile.length()}\n", "UTF-8")
        uiChecksum.get().setText(sha + "\n", "US-ASCII")
    }
}

tasks.register("moonsUiRuntime") {
    group = "build"
    description = "Builds the standalone UI runtime JAR and SHA-256 sidecar."
    dependsOn launcherUiMetadata
}

// Both launchers share payloads, metadata and source; only the full EXE embeds the UI JAR.
def registerLauncher = { String taskName, String fileName, boolean bundled ->
    tasks.register(taskName, Exec) {
        group = "build"
        description = bundled
                ? "Builds one Windows loader with its UI runtime embedded."
                : "Builds one Windows loader that downloads and caches its UI runtime."
        dependsOn universalPayloadPatch, universalPayload26_3Patch, apiJar, bridgeDll, moonsHwidExe, launcherUiMetadata

        def source = layout.projectDirectory.file("src/tools/launcher/csharp/MoonsExeLauncher.cs")
        def hardwareIdGenerator = layout.projectDirectory.file("src/tools/shared/HardwareIdGenerator.cs")
        def processEvidenceCache = layout.projectDirectory.file("src/tools/launcher/csharp/ProcessEvidenceCache.cs")
        def loadLease = layout.projectDirectory.file("src/tools/launcher/csharp/LoadLease.cs")
        def bridgeAttemptMonitor = layout.projectDirectory.file("src/tools/launcher/csharp/BridgeAttemptMonitor.cs")
        def utilitySources = files(
                "src/tools/shared/Hashing.cs",
                "src/tools/shared/StagedFile.cs",
                "src/tools/launcher/csharp/RuntimeMetadata.cs",
                "src/tools/launcher/csharp/ZipEntries.cs")
        def payload26_1 = layout.buildDirectory.file("universal/26.1/moons.jar")
        def payload26_2Patch = layout.buildDirectory.file("universal/moons-26.2.patch.zip")
        def payload26_3Patch = layout.buildDirectory.file("universal/moons-26.3.patch.zip")
        def bootstrapApi = apiJar.flatMap { it.archiveFile }
        def bridge = layout.buildDirectory.file("${moonsBuild.loaderStagingDirectory}/moons-bridge.dll")
        def output = layout.buildDirectory.file("dist/${fileName}")
        inputs.files(source, hardwareIdGenerator, processEvidenceCache, loadLease, bridgeAttemptMonitor)
        inputs.files(utilitySources)
        inputs.files(payload26_1, payload26_2Patch, payload26_3Patch, bootstrapApi, bridge, uiMetadata)
        if (bundled) inputs.file(uiRuntime)
        outputs.file(output)

        doFirst {
            if (!moonsBuild.windowsHost) throw new GradleException("${taskName} requires Windows")
            output.get().asFile.parentFile.mkdirs()
            executable locateCSharpCompiler().absolutePath
            args(
                    "/nologo", "/target:winexe", "/optimize+", "/platform:x64",
                    "/reference:System.Windows.Forms.dll", "/reference:System.Management.dll",
                    "/reference:System.IO.Compression.dll", "/reference:System.IO.Compression.FileSystem.dll",
                    "/out:${output.get().asFile.absolutePath}",
                    "/resource:${uiMetadata.get().asFile.absolutePath},Moons.UiRuntime.properties",
                    "/resource:${payload26_1.get().asFile.absolutePath},Moons.Payload.26_1.jar",
                    "/resource:${payload26_2Patch.get().asFile.absolutePath},Moons.Payload.26_2.patch",
                    "/resource:${payload26_3Patch.get().asFile.absolutePath},Moons.Payload.26_3.patch",
                    "/resource:${bootstrapApi.get().asFile.absolutePath},Moons.Api.jar",
                    "/resource:${bridge.get().asFile.absolutePath},Moons.Bridge.dll"
            )
            if (bundled) args "/resource:${uiRuntime.get().asFile.absolutePath},Moons.UiRuntime.jar"
            args hardwareIdGenerator.asFile.absolutePath, processEvidenceCache.asFile.absolutePath,
                    loadLease.asFile.absolutePath, bridgeAttemptMonitor.asFile.absolutePath, source.asFile.absolutePath
            args utilitySources.files.collect { it.absolutePath }.sort()
        }
    }
}

def moonsExe = registerLauncher("moonsExe", "moons.exe", false)
def moonsFullExe = registerLauncher("moonsFullExe", "moons-full.exe", true)

tasks.register("moonsPackages") {
    group = "build"
    description = "Builds both Windows launchers and the standalone UI runtime in one invocation."
    dependsOn moonsExe, moonsFullExe
}

tasks.named("assemble").configure {
    dependsOn tasks.named("moonsJar")
    dependsOn moonsExe
    dependsOn bridgeDll
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
