/* Universal payload assembly and Windows distribution. */
def locateJdkHome = temposToolchains.locateJdkHome
def apiJar = tasks.named("apiJar", Jar)
def bridgeDll = tasks.named("bridgeDll")
def uiDependenciesJar = tasks.named("uiDependenciesJar")
def profiles = temposVersions.profiles
def baseProfile = profiles.first()
def payloadTasks = [:]
def patchTasks = []
profiles.eachWithIndex { profile, index ->
    def previous = index == 0 ? null : payloadTasks[profiles[index - 1].profileId]
    def payloadTask = temposMultiVersion.register(profile.profileId, "universalPayload${profile.profileId}", null,
            "Builds the Minecraft ${profile.artifactId} payload for the universal loader.", ['temposJar'])
    payloadTask.configure {
        if (previous != null) dependsOn previous
        else mustRunAfter apiJar, bridgeDll
        def nestedPayload = new File(temposMultiVersion.directories[profile.profileId],
                "dist/agent/${profile.profileId}/tempos.jar")
        def publishedPayload = layout.buildDirectory.file("universal/${profile.artifactId}/tempos.jar")
        inputs.file(nestedPayload)
        outputs.file(publishedPayload)
        doLast {
            if (!nestedPayload.isFile()) {
                throw new GradleException("Nested ${profile.artifactId} payload was not produced: ${nestedPayload}")
            }
            def destination = publishedPayload.get().asFile.toPath()
            java.nio.file.Files.createDirectories(destination.parent)
            java.nio.file.Files.copy(nestedPayload.toPath(), destination,
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
    payloadTasks[profile.profileId] = payloadTask
    if (index > 0) {
        // Preserve the existing public 26.2 task name as a compatibility entry.
        def taskName = index == 1 ? 'universalPayloadPatch' : "universalPayload${profile.profileId}Patch"
        patchTasks.add(tasks.register(taskName, Exec) {
            description = "Builds a compact ${profile.artifactId} overlay over the ${baseProfile.artifactId} payload."
            dependsOn payloadTask
            def source = layout.projectDirectory.file('tools/PayloadPatchBuilder.java')
            def base = layout.buildDirectory.file("universal/${baseProfile.artifactId}/tempos.jar")
            def overlay = layout.buildDirectory.file("universal/${profile.artifactId}/tempos.jar")
            def output = layout.buildDirectory.file("universal/tempos-${profile.artifactId}.patch.zip")
            inputs.files(source, base, overlay)
            outputs.file(output)
            doFirst {
                output.get().asFile.parentFile.mkdirs()
                executable new File(locateJdkHome(), 'bin/java.exe').absolutePath
                args source.asFile.absolutePath, base.get().asFile.absolutePath,
                        overlay.get().asFile.absolutePath, output.get().asFile.absolutePath
            }
        })
    }
}

def uiRuntime = uiDependenciesJar.flatMap { it.archiveFile }
def uiMetadata = layout.buildDirectory.file("generated/launcher/ui-runtime.properties")
def uiChecksum = uiRuntime.map { file("${it.asFile.absolutePath}.sha256") }

def launcherUiMetadata = tasks.register("launcherUiMetadata") {
    dependsOn uiDependenciesJar
    inputs.file(uiRuntime)
    outputs.file(uiMetadata)
    outputs.file(uiChecksum)
    doLast {
        def runtimeFile = uiRuntime.get().asFile
        def sha = java.security.MessageDigest.getInstance("SHA-256")
                .digest(java.nio.file.Files.readAllBytes(runtimeFile.toPath()))
                .collect { String.format("%02x", it & 0xff) }.join()
        def metadataFile = uiMetadata.get().asFile
        metadataFile.parentFile.mkdirs()
        metadataFile.setText("format=1\nsha256=${sha}\nsize=${runtimeFile.length()}\n", "UTF-8")
        uiChecksum.get().setText(sha + "\n", "US-ASCII")
    }
}

tasks.register("temposUiRuntime") {
    group = "build"
    description = "Builds the standalone UI runtime JAR and SHA-256 sidecar."
    dependsOn launcherUiMetadata
}

// The standalone loader embeds its complete, matching runtime dependencies.
def ysmMetadata = layout.buildDirectory.file("generated/launcher/ysm.properties")
def ysmPackage = layout.buildDirectory.file('dist/tempos-ysm-all.zip')
def launcherDependencyMetadata = tasks.register('launcherDependencyMetadata') {
    dependsOn launcherUiMetadata, 'ysmUniversalBundle'
    inputs.file(ysmPackage)
    outputs.file(ysmMetadata)
    doLast {
        def archive = new java.util.zip.ZipFile(ysmPackage.get().asFile)
        try {
            def lines = archive.entries().findAll { !it.directory }.collect { entry ->
                def hash = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(archive.getInputStream(entry).withCloseable { it.readAllBytes() })
                        .collect { String.format('%02x', it & 0xff) }.join()
                "${entry.name}=${hash}"
            }.sort()
            ysmMetadata.get().asFile.parentFile.mkdirs()
            ysmMetadata.get().asFile.setText(lines.join('\n') + '\n', 'UTF-8')
        } finally { archive.close() }
    }
}

def releaseMetadata = layout.buildDirectory.file('generated/launcher/release.properties')
def assemblyVersionSource = layout.buildDirectory.file('generated/launcher/LauncherVersion.cs')
def clientVersion = project.version.toString()
if (!(clientVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-(?:Experiment|Release)/))
    throw new GradleException('load_version must use X.Y.Z.x-Experiment or X.Y.Z.x-Release; x is the patch sequence')
def launcherBuildId = providers.gradleProperty('tempos_build_id')
        .getOrElse(providers.environmentVariable('GITHUB_SHA').getOrElse('local'))
def launcherVersionMetadata = tasks.register('launcherVersionMetadata') {
    dependsOn launcherDependencyMetadata
    inputs.files(uiMetadata, ysmMetadata)
    inputs.property('clientVersion', clientVersion)
    inputs.property('buildId', launcherBuildId)
    outputs.files(releaseMetadata, assemblyVersionSource)
    doLast {
        if (!(launcherBuildId ==~ /[A-Za-z0-9._-]+/))
            throw new GradleException('tempos_build_id must contain only letters, digits, dots, underscores or dashes')
        def numeric = clientVersion.split('[-+]')[0]
        if (numeric.split('\\.').any { it.toBigInteger() > 65534 })
            throw new GradleException('Version components must fit the Windows version resource (0..65534)')
        def sha256 = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
                .collect { String.format('%02x', it & 0xff) }.join() }
        def ui = new Properties()
        uiMetadata.get().asFile.withInputStream { ui.load(it) }
        def uiHash = ui.getProperty('sha256')
        def ysmHash = sha256(ysmMetadata.get().asFile.bytes)
        // Client releases and build IDs do not affect dependency identity.
        def dependencyHash = sha256((uiHash + '\n' + ysmHash).getBytes('UTF-8'))
        releaseMetadata.get().asFile.setText(
                "format=1\nclient.version=${clientVersion}\nbuild.id=${launcherBuildId}\n"
                + "dependencies.version=${dependencyHash.take(12)}\n"
                + "ui.version=${uiHash.take(12)}\nysm.version=${ysmHash.take(12)}\n", 'UTF-8')
        assemblyVersionSource.get().asFile.setText(
                "using System.Reflection;\n[assembly: AssemblyVersion(\"${numeric}\")]\n"
                + "[assembly: AssemblyFileVersion(\"${numeric}\")]\n"
                + "[assembly: AssemblyInformationalVersion(\"${clientVersion} (${launcherBuildId})\")]\n", 'UTF-8')
    }
}

def finalizerOutput = layout.buildDirectory.file('generated/launcher/tempos-finalizer.exe')
def sessionFinalizerExe = tasks.register('sessionFinalizerExe', Exec) {
    def sources = files('src/tools/launcher/csharp/SessionFinalizer.cs',
            'src/tools/launcher/csharp/PortableConfig.cs', 'src/tools/launcher/csharp/LegacyConfigMigration.cs',
            'src/tools/launcher/csharp/LegacyModelMigration.cs', 'src/tools/launcher/csharp/NativeDialogs.cs')
    temposToolchains.csharpExe(delegate, finalizerOutput, sources, ['/target:winexe', '/optimize+',
            '/platform:x64', '/main:Tempos.WindowsLauncher.SessionFinalizer', '/reference:System.Web.Extensions.dll',
            '/reference:System.Windows.Forms.dll', '/reference:System.Drawing.dll'])
}

def temposExe = tasks.register('temposExe', Exec) {
    group = 'build'
    description = 'Builds the standalone game loader with all runtime dependencies embedded.'
    dependsOn launcherVersionMetadata, 'launcherVersionCatalog', patchTasks, apiJar, bridgeDll, sessionFinalizerExe
    def sources = temposToolchains.launcherCommonSources + files(assemblyVersionSource)
    sources += fileTree('src/tools/launcher/csharp/ui') { include '**/*.cs' }
    sources += files('src/tools/launcher/csharp/TemposExeLauncher.cs',
            'src/tools/common/HardwareIdGenerator.cs',
            'src/tools/launcher/csharp/TemporaryPayloadSession.cs',
            'src/tools/launcher/csharp/PortableConfig.cs',
            'src/tools/launcher/csharp/LegacyConfigMigration.cs',
            'src/tools/launcher/csharp/LegacyModelMigration.cs',
            'src/tools/launcher/csharp/LegacyMigration.cs',
            'src/tools/launcher/csharp/LoadSession.cs', 'src/tools/launcher/csharp/ZipEntries.cs')
    def resources = [
            'Tempos.UiRuntime.properties': uiMetadata,
            'Tempos.Ysm.properties': ysmMetadata,
            'Tempos.Release.properties': releaseMetadata,
            'Tempos.Ysm.zip': ysmPackage,
            'Tempos.UiRuntime.jar': uiRuntime]
    resources['Tempos.Finalizer.exe'] = finalizerOutput
    profiles.eachWithIndex { profile, index ->
        def suffix = index == 0 ? 'jar' : 'patch'
        resources["Tempos.Payload.${profile.profileId}.${suffix}"] = index == 0
                ? layout.buildDirectory.file("universal/${profile.artifactId}/tempos.jar")
                : layout.buildDirectory.file("universal/tempos-${profile.artifactId}.patch.zip")
    }
    resources['Tempos.Api.jar'] = apiJar.flatMap { it.archiveFile }
    resources['Tempos.Bridge.dll'] = layout.buildDirectory.file("${temposBuild.loaderStagingDirectory}/tempos-bridge.dll")
    def output = layout.buildDirectory.file('dist/tempos.exe')
    def manifest = file('src/tools/launcher/launcher.manifest')
    inputs.file(manifest)
    temposToolchains.csharpExe(delegate, output, sources, ['/target:winexe', '/optimize+', '/platform:x64',
            "/win32manifest:${manifest.absolutePath}", '/reference:System.Windows.Forms.dll',
            '/reference:System.Management.dll', '/reference:System.Web.Extensions.dll',
            '/reference:System.IO.Compression.dll', '/reference:System.IO.Compression.FileSystem.dll'], resources)
}

tasks.register('temposPackages') {
    group = 'build'
    description = 'Builds the standalone tempos.exe with its complete embedded runtime and release archive.'
    dependsOn temposExe
}

tasks.register('temposBuild') {
    group = 'build'
    description = 'Checks every supported version, packages the standalone loader and verifies the real EXE.'
    dependsOn 'checkAllVersions', 'verifyLauncherPackages'
}

tasks.named('assemble').configure {
    dependsOn tasks.named('temposJar'), temposExe, bridgeDll
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
