def moonsHwidExe = tasks.register("moonsHwidExe", Exec) {
    group = "build"
    description = "Builds the out-of-process Windows hardware ID helper."

    def source = layout.projectDirectory.file("src/tools/hwid/csharp/MoonsHardwareId.cs")
    def generator = layout.projectDirectory.file("src/tools/shared/HardwareIdGenerator.cs")
    def hashing = layout.projectDirectory.file("src/tools/shared/Hashing.cs")
    def output = layout.buildDirectory.file("dist/moons-hwid.exe")
    inputs.file(source)
    inputs.file(generator)
    inputs.file(hashing)
    outputs.file(output)

    doFirst {
        if (!System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")) {
            throw new GradleException("moonsHwidExe currently requires Windows")
        }
        def compiler = locateCSharpCompiler()

        output.get().asFile.parentFile.mkdirs()
        executable compiler.absolutePath
        args(
                "/nologo",
                "/target:winexe",
                "/optimize+",
                "/platform:x64",
                "/reference:System.Management.dll",
                "/reference:System.Windows.Forms.dll",
                "/out:${output.get().asFile.absolutePath}",
                generator.asFile.absolutePath,
                hashing.asFile.absolutePath,
                source.asFile.absolutePath
        )
    }
}

def uiRuntime = uiDependenciesJar.flatMap { it.archiveFile }
def uiMetadata = layout.buildDirectory.file("generated/launcher/ui-runtime.properties")
def uiChecksum = uiRuntime.map { file("${it.asFile.absolutePath}.sha256") }

def launcherUiMetadata = tasks.register("launcherUiMetadata") {
    dependsOn uiDependenciesJar
    inputs.file(uiRuntime)
    outputs.file(uiMetadata)
    outputs.file(uiChecksum)
    doLast {
        def runtimeFile = uiRuntime.get().asFile
        def sha = java.security.MessageDigest.getInstance("SHA-256")
                .digest(java.nio.file.Files.readAllBytes(runtimeFile.toPath()))
                .collect { String.format("%02x", it & 0xff) }.join()
        def metadataFile = uiMetadata.get().asFile
        metadataFile.parentFile.mkdirs()
        metadataFile.setText("format=1\nsha256=${sha}\nsize=${runtimeFile.length()}\n", "UTF-8")
        uiChecksum.get().setText(sha + "\n", "US-ASCII")
    }
}

tasks.register("moonsUiRuntime") {
    group = "build"
    description = "Builds the standalone UI runtime JAR and SHA-256 sidecar."
    dependsOn launcherUiMetadata
}

// The installer owns dependency updates; the loader carries only game-loading payloads.
def ysmMetadata = layout.buildDirectory.file("generated/launcher/ysm.properties")
def ysmPackage = layout.buildDirectory.file('dist/moons-ysm-all.zip')
def launcherDependencyMetadata = tasks.register('launcherDependencyMetadata') {
    dependsOn launcherUiMetadata, 'ysmUniversalBundle'
    inputs.file(ysmPackage)
    outputs.file(ysmMetadata)
    doLast {
        def archive = new java.util.zip.ZipFile(ysmPackage.get().asFile)
        try {
            def lines = archive.entries().findAll { !it.directory }.collect { entry ->
                def hash = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(archive.getInputStream(entry).withCloseable { it.readAllBytes() })
                        .collect { String.format('%02x', it & 0xff) }.join()
                "${entry.name}=${hash}"
            }.sort()
            ysmMetadata.get().asFile.parentFile.mkdirs()
            ysmMetadata.get().asFile.setText(lines.join('\n') + '\n', 'UTF-8')
        } finally { archive.close() }
    }
}

def releaseMetadata = layout.buildDirectory.file('generated/launcher/release.properties')
def assemblyVersionSource = layout.buildDirectory.file('generated/launcher/LauncherVersion.cs')
def clientVersion = project.version.toString()
def launcherBuildId = providers.gradleProperty('moons_build_id')
        .getOrElse(providers.environmentVariable('GITHUB_SHA').getOrElse('local'))
def launcherVersionMetadata = tasks.register('launcherVersionMetadata') {
    dependsOn launcherDependencyMetadata
    inputs.files(uiMetadata, ysmMetadata)
    inputs.property('clientVersion', clientVersion)
    inputs.property('buildId', launcherBuildId)
    outputs.files(releaseMetadata, assemblyVersionSource)
    doLast {
        if (!(clientVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?(?:\+[A-Za-z0-9.-]+)?/))
            throw new GradleException('load_version must use major.minor.patch, optionally with a prerelease/build suffix')
        if (!(launcherBuildId ==~ /[A-Za-z0-9._-]+/))
            throw new GradleException('moons_build_id must contain only letters, digits, dots, underscores or dashes')
        def numeric = clientVersion.split('[-+]')[0]
        if (numeric.split('\\.').any { it.toBigInteger() > 65534 })
            throw new GradleException('Version components must fit the Windows version resource (0..65534)')
        def sha256 = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
                .collect { String.format('%02x', it & 0xff) }.join() }
        def ui = new Properties()
        uiMetadata.get().asFile.withInputStream { ui.load(it) }
        def uiHash = ui.getProperty('sha256')
        def ysmHash = sha256(ysmMetadata.get().asFile.bytes)
        // Client releases and build IDs do not affect dependency identity.
        def dependencyHash = sha256((uiHash + '\n' + ysmHash).getBytes('UTF-8'))
        releaseMetadata.get().asFile.setText(
                "format=1\nclient.version=${clientVersion}\nbuild.id=${launcherBuildId}\n"
                + "dependencies.version=${dependencyHash.take(12)}\n"
                + "ui.version=${uiHash.take(12)}\nysm.version=${ysmHash.take(12)}\n", 'UTF-8')
        assemblyVersionSource.get().asFile.setText(
                "using System.Reflection;\n[assembly: AssemblyVersion(\"${numeric}.0\")]\n"
                + "[assembly: AssemblyFileVersion(\"${numeric}.0\")]\n"
                + "[assembly: AssemblyInformationalVersion(\"${clientVersion} (${launcherBuildId})\")]\n", 'UTF-8')
    }
}

def registerLauncher = { String taskName, String fileName, boolean installer ->
    tasks.register(taskName, Exec) {
        group = 'build'
        description = installer ? 'Builds the dependency installer/updater.' : 'Builds the game loader using installed dependencies.'
        dependsOn launcherVersionMetadata
        if (!installer) dependsOn universalPayloadPatch, universalPayload26_3Patch, apiJar, bridgeDll, moonsHwidExe
        def sources = files(
                'src/tools/shared/Hashing.cs', 'src/tools/shared/StagedFile.cs',
                'src/tools/launcher/csharp/RuntimeMetadata.cs',
                'src/tools/launcher/csharp/DependencyRuntime.cs',
                'src/tools/launcher/csharp/CacheMaintenance.cs', assemblyVersionSource)
        if (installer) {
            sources += files('src/tools/launcher/csharp/DependencyInstaller.cs',
                    'src/tools/launcher/csharp/YsmPackage.cs', 'src/tools/launcher/csharp/ZipEntries.cs')
        } else {
            sources += files('src/tools/launcher/csharp/MoonsExeLauncher.cs',
                    'src/tools/shared/HardwareIdGenerator.cs',
                    'src/tools/launcher/csharp/ProcessEvidenceCache.cs',
                    'src/tools/launcher/csharp/LoadSession.cs', 'src/tools/launcher/csharp/ZipEntries.cs')
        }
        def resources = [
                'Moons.UiRuntime.properties': uiMetadata,
                'Moons.Ysm.properties': ysmMetadata,
                'Moons.Release.properties': releaseMetadata]
        if (installer) {
            resources['Moons.Ysm.zip'] = ysmPackage
            resources['Moons.UiRuntime.jar'] = uiRuntime
        } else {
            resources['Moons.Payload.26_1.jar'] = layout.buildDirectory.file('universal/26.1/moons.jar')
            resources['Moons.Payload.26_2.patch'] = layout.buildDirectory.file('universal/moons-26.2.patch.zip')
            resources['Moons.Payload.26_3.patch'] = layout.buildDirectory.file('universal/moons-26.3.patch.zip')
            resources['Moons.Api.jar'] = apiJar.flatMap { it.archiveFile }
            resources['Moons.Bridge.dll'] = layout.buildDirectory.file("${moonsBuild.loaderStagingDirectory}/moons-bridge.dll")
        }
        def output = layout.buildDirectory.file("dist/${fileName}")
        inputs.files(sources)
        inputs.files(resources.values())
        outputs.file(output)
        doFirst {
            if (!moonsBuild.windowsHost) throw new GradleException("${taskName} requires Windows")
            output.get().asFile.parentFile.mkdirs()
            executable locateCSharpCompiler().absolutePath
            args '/nologo', '/target:winexe', '/optimize+', '/platform:x64',
                    '/reference:System.Windows.Forms.dll', '/reference:System.Management.dll',
                    '/reference:System.IO.Compression.dll', '/reference:System.IO.Compression.FileSystem.dll',
                    "/out:${output.get().asFile.absolutePath}"
            args resources.collect { name, path -> "/resource:${path.get().asFile.absolutePath},${name}" }
            args sources.files.collect { it.absolutePath }.sort()
        }
    }
}

def moonsExe = registerLauncher('moonsExe', 'moon.exe', false)
def moonsInstallExe = registerLauncher('moonsInstallExe', 'moon-install.exe', true)

tasks.register('moonsPackages') {
