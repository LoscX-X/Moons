name: Project checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        type: choice
        default: all
        options:
          - all
          - install
          - loader
      verify:
        description: Verify Minecraft hooks, YSM rendering and update behavior
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
      client_version: ${{ steps.version.outputs.client_version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Show client version and commit
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $properties = Get-Content gradle.properties -Raw
          $match = [regex]::Match($properties, '(?m)^load_version=([^\r\n]+)\r?$')
          $version = $match.Groups[1].Value.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?(?:\+[A-Za-z0-9.-]+)?$') {
            throw 'Missing or invalid load_version in gradle.properties'
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot determine checked-out commit' }
          $short = $commit.Substring(0, 8)
          "client_version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$short" >> $env:GITHUB_OUTPUT
          Write-Output "Client version: $version | Commit: $commit"
          New-Item -ItemType Directory -Path build/ci -Force | Out-Null
          @(
            '## Build information', '',
            '| Item | Value |', '| --- | --- |',
            ('| Client version | `{0}` |' -f $version),
            ('| Commit | [`{0}`]({1}/{2}/commit/{3}) |' -f $short, $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $commit),
            ('| Full commit | `{0}` |' -f $commit)
          ) | Set-Content build/ci/build-info.md -Encoding utf8
          Get-Content build/ci/build-info.md >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify Minecraft hooks and YSM behavior
        if: github.event_name != 'workflow_dispatch' || inputs.verify
        shell: pwsh
        run: .\gradlew.bat verifyMinecraftTransformers checkAllVersions --console=plain
      - name: Package YSM for all supported versions
        if: github.event_name == 'pull_request' || (github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: pwsh
        run: .\gradlew.bat ysmAllVersions --console=plain
      - name: Build selected packages
        id: package
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ inputs.package || 'all' }}
          VERIFY_PACKAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.verify }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tasks = @(switch ($env:PACKAGE_KIND) {
            'all'        { @('moonsPackages') }
            'install'    { @('moonsInstallExe') }
            'loader'     { @('moonsExe') }
            default     { throw "Unknown package: $env:PACKAGE_KIND" }
          })
          if ($env:PACKAGE_KIND -eq 'all' -and $env:VERIFY_PACKAGES -eq 'true') {
            $tasks += 'verifyLauncherPackages'
          }
          $tag = "build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "kind=$env:PACKAGE_KIND" >> $env:GITHUB_OUTPUT
          .\gradlew.bat @tasks --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Name executable release files
        id: assets
        if: steps.package.outputs.kind == 'all' || steps.package.outputs.kind == 'install' || steps.package.outputs.kind == 'loader'
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ steps.package.outputs.kind }}
          CLIENT_VERSION: ${{ steps.version.outputs.client_version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = ConvertFrom-StringData (Get-Content build/generated/launcher/release.properties -Raw)
          if ($metadata['client.version'] -ne $env:CLIENT_VERSION -or $metadata['build.id'] -ne $env:GITHUB_SHA) {
            throw 'Executable build metadata does not match the release filename'
          }
          New-Item -ItemType Directory -Path build/ci/packages -Force | Out-Null
          $files = @()
          if ($env:PACKAGE_KIND -in @('all', 'loader')) { $files += @{ Prefix = 'moon'; Role = 'loader' } }
          if ($env:PACKAGE_KIND -in @('all', 'install')) { $files += @{ Prefix = 'moon-install'; Role = 'installer' } }
          foreach ($entry in $files) {
            $name = '{0}-{1}-{2}.exe' -f $entry.Prefix, $env:CLIENT_VERSION, $env:SHORT_SHA
            Copy-Item -LiteralPath ('build/dist/{0}.exe' -f $entry.Prefix) -Destination (Join-Path build/ci/packages $name) -Force
            ('{0}_name={1}' -f $entry.Role, $name) >> $env:GITHUB_OUTPUT
            ('| {0} file | `{1}` |' -f $entry.Role, $name) >> build/ci/build-info.md
            Write-Output "Release file: $name"
          }
      - name: Show dependency versions
        if: always() && steps.version.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rows = @()
          $release = 'build/generated/launcher/release.properties'
          if (Test-Path -LiteralPath $release) {
            $metadata = ConvertFrom-StringData (Get-Content -LiteralPath $release -Raw)
            foreach ($entry in @(@('Dependencies', 'dependencies.version'), @('UI', 'ui.version'), @('YSM', 'ysm.version'))) {
              $value = $metadata[$entry[1]]
              $rows += ('| {0} version | `{1}` |' -f $entry[0], $value)
              Write-Output ("{0} version: {1}" -f $entry[0], $value)
            }
          } elseif (Test-Path -LiteralPath 'build/generated/launcher/ui-runtime.properties') {
            $metadata = ConvertFrom-StringData (Get-Content build/generated/launcher/ui-runtime.properties -Raw)
            $rows += ('| UI version | `{0}` |' -f $metadata['sha256'].Substring(0, 12))
          } else {
            $rows += '| Dependency versions | Not generated by this run |'
          }
          $rows >> build/ci/build-info.md
          @('', '## Dependency versions', '', '| Item | Value |', '| --- | --- |') + $rows >> $env:GITHUB_STEP_SUMMARY
      - name: Upload build information
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: moons-build-info
          retention-days: 7
          path: build/ci/build-info.md
          if-no-files-found: error
      - name: Upload YSM bundles
        uses: actions/upload-artifact@v6
        with:
          name: moons-ysm
          retention-days: 7
          overwrite: true
          path: build/dist/moons-ysm-*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload dependency installer
        if: steps.package.outputs.kind == 'all' || steps.package.outputs.kind == 'install'
        uses: actions/upload-artifact@v6
        with:
          name: moons-install-${{ steps.version.outputs.client_version }}-${{ steps.version.outputs.short_sha }}
          retention-days: 7
          overwrite: true
          path: build/ci/packages/${{ steps.assets.outputs.installer_name }}
          if-no-files-found: error
          compression-level: 0
      - name: Upload game loader
        if: steps.package.outputs.kind == 'all' || steps.package.outputs.kind == 'loader'
        uses: actions/upload-artifact@v6
        with:
          name: moons-loader-${{ steps.version.outputs.client_version }}-${{ steps.version.outputs.short_sha }}
          retention-days: 7
          overwrite: true
          path: build/ci/packages/${{ steps.assets.outputs.loader_name }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: check
    if: needs.check.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: moons-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: moons-*
          merge-multiple: true
          path: artifacts
      - name: Publish installer and loader
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          CLIENT_VERSION: ${{ needs.check.outputs.client_version }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/build-info.md > release-notes.md
          printf '\n\n' >> release-notes.md
          cat >> release-notes.md <<'NOTES'
          - `moon-install-<version>-<commit>.exe`: includes and installs matching UI dependencies, shared YSM libraries and game adapters entirely offline. Run this for first-time setup or when dependencies change.
          - `moon-<version>-<commit>.exe`: validates installed dependencies and loads Moons into Minecraft.
          - If the dependency version is unchanged and the installed files are intact, updating only the loader is enough. The installer skips files whose content is unchanged.
          - The installer contains the runtime; no separate JAR or dependency download is required.
          - `moons-ysm-all.zip`: standalone YSM bundle with one shared library set and all supported adapters.
          - `moons-ysm-<version>.zip`: optional standalone bundle for one game version.

          Only assets selected for this run are included. The loader supports Minecraft 26.1.2, 26.2, 26.3-rc-2 and 26.3-rc-3.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Moons $CLIENT_VERSION · $SHORT_SHA (Build $GITHUB_RUN_NUMBER)" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
      - name: Clean up old automatic releases and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-GhJson {
            param([string[]] $Arguments)
            $output = & gh @Arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub request failed: $Arguments" }
            ($output -join "`n") | ConvertFrom-Json
          }
          function Remove-GhObject {
            param([string[]] $Arguments)
            & gh @Arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub deletion failed: $Arguments" }
          }
          $repo = $env:GITHUB_REPOSITORY
          $pages = Invoke-GhJson -Arguments @('api', '--paginate', '--slurp', "repos/$repo/releases?per_page=100")
          $releases = @(foreach ($page in $pages) { foreach ($release in $page) { $release } })
          $automatic = @($releases | Where-Object {
            $_.prerelease -eq $true -and !$_.draft -and !$_.immutable -and
            $_.tag_name -cmatch '^build-[0-9]+-[0-9]+$'
          } | Sort-Object -Property published_at, id -Descending)
          $deletedReleases = 0
          foreach ($release in ($automatic | Select-Object -Skip 5)) {
            if ($release.tag_name -eq $env:RELEASE_TAG) { continue }
            # Recheck in case a prerelease was promoted after the listing.
            $fresh = Invoke-GhJson -Arguments @('api', "repos/$repo/releases/$($release.id)")
            if ($fresh.prerelease -ne $true -or $fresh.draft -or $fresh.immutable -or
                $fresh.tag_name -cne $release.tag_name) { continue }
            Remove-GhObject -Arguments @('release', 'delete', $release.tag_name, '--repo', $repo, '--cleanup-tag', '--yes')
            $deletedReleases++
          }
          $cutoff = [DateTimeOffset]::UtcNow.AddDays(-7)
          $pages = Invoke-GhJson -Arguments @('api', '--paginate', '--slurp', "repos/$repo/actions/artifacts?per_page=100")
          $artifacts = @(foreach ($page in $pages) { $page.artifacts })
          $deletedArtifacts = 0
          foreach ($artifact in $artifacts) {
            if ($artifact.name -cnotmatch '^moons-(build-info|ysm|install(?:-.+)?|loader(?:-.+)?)$' -or
                [DateTimeOffset]::Parse($artifact.created_at) -ge $cutoff -or
                !$artifact.workflow_run.id -or $artifact.workflow_run.id -eq $env:GITHUB_RUN_ID) { continue }
            $run = Invoke-GhJson -Arguments @('api', "repos/$repo/actions/runs/$($artifact.workflow_run.id)")
            if ($run.path -cne '.github/workflows/check.yml' -or $run.status -ne 'completed') { continue }
            Remove-GhObject -Arguments @('api', '--method', 'DELETE', "repos/$repo/actions/artifacts/$($artifact.id)")
            $deletedArtifacts++
          }
          @('', '## Build retention', '',
            "Removed $deletedReleases old automatic prereleases and their tags; retain the newest 5 (and this run).",
            "Removed $deletedArtifacts workflow artifacts older than 7 days.") >> $env:GITHUB_STEP_SUMMARY
