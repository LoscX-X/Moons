tasks.named('verifyMinecraftTransformers', JavaExec) {
    doFirst {
        def minecraftJars = sourceSets.client.compileClasspath.files.findAll {
            it.name.toLowerCase(Locale.ROOT).startsWith("minecraft-")
                    && it.name.toLowerCase(Locale.ROOT).endsWith(".jar")
        }
        if (minecraftJars.isEmpty()) {
            throw new GradleException("Unable to locate the Loom Minecraft JARs")
        }
        def sodiumJar = file("libs/sodium.jar")
        if (sodiumJar.isFile()) minecraftJars.add(sodiumJar)
        args = minecraftJars.collect { it.absolutePath }
    }
}

// Opt-in checks use a locally installed NeoForge profile, not the unpatched Loom JAR.
def neoForgeClientJar = {
    def path = providers.gradleProperty('tempos_neoforge_client_jar').orNull
    if (path == null || !file(path).isFile()) {
        throw new GradleException('Set -Ptempos_neoforge_client_jar to the patched Minecraft client JAR')
    }
    def client = file(path)
    new java.util.jar.JarFile(client).withCloseable { jar ->
        def entry = jar.getJarEntry('net/minecraft/client/KeyMapping.class')
        def interfaces = entry == null ? [] : jar.getInputStream(entry).withCloseable { input ->
            java.lang.classfile.ClassFile.of().parse(input.readAllBytes()).interfaces()
                    .collect { it.asInternalName() }
        }
        if (!interfaces.contains('net/neoforged/neoforge/client/extensions/IKeyMappingExtension')) {
            throw new GradleException('Expected the NeoForge-patched client from libraries/net/neoforged/'
                    + 'minecraft-client-patched; the versions profile JAR may be unmodified Minecraft: ' + client)
        }
    }
    return client
}

tasks.named('verifyNeoForgeTransformers', JavaExec) {
    doFirst {
        args = [neoForgeClientJar().absolutePath]
    }
}

def neoForgeRuntimeClasspath = { vanillaClasspath ->
    def path = providers.gradleProperty('tempos_neoforge_profile_json').orNull
    if (path == null || !file(path).isFile()) {
        throw new GradleException('Set -Ptempos_neoforge_profile_json to the installed version JSON')
    }
    def profileFile = file(path)
    def profile = new groovy.json.JsonSlurper().parse(profileFile)
    def librariesRoot = new File(profileFile.parentFile.parentFile.parentFile, 'libraries')
    def versionIndex = profile.arguments.game.indexOf('--fml.neoForgeVersion')
    if (versionIndex < 0 || versionIndex + 1 >= profile.arguments.game.size()) {
        throw new GradleException('The profile does not specify --fml.neoForgeVersion')
    }
    def neoForgeVersion = profile.arguments.game[versionIndex + 1]
    def universal = new File(librariesRoot,
            "net/neoforged/neoforge/${neoForgeVersion}/neoforge-${neoForgeVersion}-universal.jar")
    if (!universal.isFile()) throw new GradleException("Missing NeoForge universal JAR: ${universal}")
    def libraries = profile.libraries.collect { library ->
        def artifactPath = library.downloads?.artifact?.path
        if (artifactPath == null) {
            def parts = library.name.split(':')
            def artifact = "${parts[1]}-${parts[2]}" + (parts.length > 3 ? "-${parts[3]}" : '') + '.jar'
            artifactPath = parts[0].replace('.', '/') + "/${parts[1]}/${parts[2]}/${artifact}"
        }
        new File(librariesRoot, artifactPath)
    }.findAll { it.isFile() && !it.name.startsWith('minecraft-client-patched-') }
    // The explicitly validated patched client must win over any profile/base Minecraft classes.
    def patched = neoForgeClientJar()
    libraries = libraries.findAll { library ->
        !library.path.replace('\\', '/').contains('/net/minecraft/') && library != patched
    }
    return files(patched, universal, libraries,
            vanillaClasspath.files.findAll { !it.name.startsWith('minecraft-') })
}

