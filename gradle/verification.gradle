/* Opt-in mapping/injection validation. YSM checks are registered in ysm.gradle; fixtures are not packaged. */
tasks.named("test", Test) {
    enabled = false
}

sourceSets {
    renderTest {
        java.setSrcDirs(['src/test/render/java'])
        compileClasspath += sourceSets.features.output + sourceSets.client.output + sourceSets.agent.output + sourceSets.runtime.output + sourceSets.api.output + sourceSets.features.compileClasspath + configurations.agentRuntimeClasspath
        runtimeClasspath += compileClasspath
    }
}

tasks.register('verifyArmorHide', JavaExec) {
    group = 'verification'
    description = 'Checks custom-model head items, cached render states and the injected item resolver without a GPU.'
    dependsOn 'renderTestClasses'
    classpath = sourceSets.renderTest.runtimeClasspath
    mainClass = 'com.blanoir.moons.agent.core.ArmorHeadItemVerification'
    systemProperty 'moons.home', layout.buildDirectory.dir('armor-hide-fixture/home').get().asFile.absolutePath
    workingDir layout.buildDirectory.get().asFile
}

tasks.register('verifyNicknameShuffle', JavaExec) {
    group = 'verification'
    description = 'Checks shuffled display names, independent skins, skin recursion and reset without a GPU.'
    dependsOn 'renderTestClasses'
    classpath = sourceSets.renderTest.runtimeClasspath
    mainClass = 'com.blanoir.moons.client.module.impl.render.NicknameShuffleVerification'
    systemProperty 'moons.home', layout.buildDirectory.dir('nickname-fixture/home').get().asFile.absolutePath
    workingDir layout.buildDirectory.get().asFile
}

[
        verifyBacktrackFlow: 'com.blanoir.moons.client.module.impl.network.backtrack.BacktrackFlowVerification',
        verifyAntiWebCycle: 'com.blanoir.moons.client.module.impl.player.AntiWebCycleVerification',
        verifyPlacementRays: 'com.blanoir.moons.client.utils.world.placement.PlacementRaycastVerification'
].each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Checks packet flow, bounded interaction cycles or placement geometry without a GPU.'
        dependsOn 'renderTestClasses'
        classpath = sourceSets.renderTest.runtimeClasspath
        mainClass = entryPoint
        systemProperty 'moons.home', layout.buildDirectory.dir("${taskName}-fixture/home").get().asFile.absolutePath
        workingDir layout.buildDirectory.get().asFile
    }
}

tasks.register("verifyMinecraftTransformers", JavaExec) {
    group = "verification"
    description = "Transforms and bytecode-verifies every supported hook against the actual Minecraft JAR."
    dependsOn tasks.named("loaderTestClasses")
    classpath = sourceSets.loaderTest.runtimeClasspath
    mainClass = "com.blanoir.moons.agent.core.TransformerVerification"
    doFirst {
        def minecraftJars = sourceSets.client.compileClasspath.files.findAll {
            it.name.toLowerCase(Locale.ROOT).startsWith("minecraft-")
                    && it.name.toLowerCase(Locale.ROOT).endsWith(".jar")
        }
        if (minecraftJars.isEmpty()) {
            throw new GradleException("Unable to locate the Loom Minecraft JARs")
        }
        def sodiumJar = file("libs/sodium.jar")
        if (sodiumJar.isFile()) minecraftJars.add(sodiumJar)
        args = minecraftJars.collect { it.absolutePath }
    }
}


tasks.named("check").configure {
    dependsOn "clientClasses", "featuresClasses", "verifyMinecraftTransformers", "verifyArmorHide", "verifyNicknameShuffle", "verifyBacktrackFlow", "verifyAntiWebCycle", "verifyPlacementRays"
}

def versionChecks = []
moonsBuild.supportedVersions.each { minecraftVersion, directory ->
    def previousCheck = versionChecks.isEmpty() ? null : versionChecks.last()
    def versionCheck = tasks.register("checkMinecraft${directory}", Exec) {
        group = "verification"
        description = "Compiles production sources and verifies hooks and YSM behavior for Minecraft ${minecraftVersion}."
        if (previousCheck != null) {
            mustRunAfter previousCheck
        }
        mustRunAfter tasks.named("check")
        workingDir project.projectDir
        executable moonsToolchains.gradleExecutable.absolutePath
        def nestedBuild = layout.buildDirectory.dir("checks/${directory}").get().asFile.absolutePath
        args moonsToolchains.nestedGradleArguments([
                "check",
                "-Pminecraft_version=${minecraftVersion}",
                "-Pmoons_build_directory=${nestedBuild}",
                "-Pmoons_jar_output_directory=verification/agent/${directory}"
        ].collect { it.toString() })
    }
    versionChecks.add(versionCheck)
}


tasks.register("checkAllVersions") {
    group = "verification"
    description = "Compiles production sources and verifies hooks and YSM behavior for each supported Minecraft version."
    dependsOn versionChecks
}


def loadSessionCheckExe = tasks.register('loadSessionVerificationExe', Exec) {
    onlyIf { moonsBuild.windowsHost }
    def sources = files('src/tools/launcher/csharp/LoadSession.cs', 'src/test/launcher/LoadSessionVerification.cs')
    def output = layout.buildDirectory.file('verification/load-session.exe')
    inputs.files(sources)
    outputs.file(output)
    doFirst {
        output.get().asFile.parentFile.mkdirs()
        executable moonsToolchains.locateCSharpCompiler().absolutePath
        args '/nologo', '/target:exe', "/out:${output.get().asFile.absolutePath}"
        args sources.files.collect { it.absolutePath }.sort()
    }
}

tasks.register('verifyLoadSession', Exec) {
    group = 'verification'
    description = 'Checks launcher attempt isolation, startup logs and cancellation without injecting a process.'
    onlyIf { moonsBuild.windowsHost }
    dependsOn loadSessionCheckExe
    executable layout.buildDirectory.file('verification/load-session.exe').get().asFile.absolutePath
}

tasks.named('check').configure { dependsOn 'verifyLoadSession' }

tasks.register('verifyLauncherPackages', Exec) {
    group = 'verification'
    description = 'Verifies the real installer and loader against an isolated dependency home without loading a game.'
    onlyIf { moonsBuild.windowsHost }
    dependsOn 'moonsPackages'
    executable 'powershell.exe'
    args '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            layout.projectDirectory.file('src/test/launcher/Verify-LauncherPackages.ps1').asFile.absolutePath,
            '-Distribution', layout.buildDirectory.dir('dist').get().asFile.absolutePath,
            '-FixtureRoot', layout.buildDirectory.dir('verification/launcher-packages').get().asFile.absolutePath
}
