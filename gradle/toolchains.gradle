import java.util.regex.Pattern

/* Lazily resolve host tools only when a task needs them. */
def windowsHost = temposBuild.windowsHost

def locateCmake = {
    def executableName = windowsHost ? "cmake.exe" : "cmake"
    def candidates = []
    def pathValue = System.getenv("PATH")
    if (pathValue != null) {
        pathValue.split(Pattern.quote(File.pathSeparator)).each {
            if (!it.isBlank()) candidates.add(file(it).toPath().resolve(executableName).toFile())
        }
    }
    if (windowsHost) {
        candidates.add(file("C:/Program Files/CMake/bin/cmake.exe"))
        candidates.add(file("C:/Program Files (x86)/CMake/bin/cmake.exe"))

        def vswhere = file("C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe")
        if (vswhere.isFile()) {
            def process = new ProcessBuilder(
                    vswhere.absolutePath,
                    "-latest",
                    "-products", "*",
                    "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
                    "-property", "installationPath"
            ).redirectErrorStream(true).start()
            def installation = process.inputStream.getText("UTF-8").trim()
            if (process.waitFor() == 0 && !installation.isBlank()) {
                candidates.add(file(installation).toPath().resolve(
                        "Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe"
                ).toFile())
            }
        }
    }
    def cmake = candidates.find { it.isFile() }
    if (cmake == null) {
        throw new GradleException("CMake was not found; install the Visual Studio C++ CMake tools")
    }
    return cmake
}

def locateJdkHome = {
    def candidates = [
            file(System.getProperty("java.home")),
            project.hasProperty("org.gradle.java.home")
                    ? file(project.property("org.gradle.java.home"))
                    : null
    ].findAll { it != null }
    def jdk = candidates.find { new File(it, "include/jni.h").isFile() }
    if (jdk == null) {
        throw new GradleException("The Gradle JVM must be a JDK containing JNI/JVMTI headers")
    }
    return jdk
}

def locateCSharpCompiler = {
    def compiler = [
            file("C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe"),
            file("C:/Windows/Microsoft.NET/Framework/v4.0.30319/csc.exe")
    ].find { it.isFile() }
    if (compiler == null) {
        throw new GradleException("Windows C# compiler was not found; install .NET Framework 4.x")
    }
    return compiler
}

def launcherCommonSources = files(
        'src/tools/common/Hashing.cs', 'src/tools/common/StagedFile.cs',
        'src/tools/launcher/csharp/RuntimeMetadata.cs',
        'src/tools/launcher/csharp/VersionCatalog.cs', temposVersions.launcherSource,
        'src/tools/launcher/csharp/DependencyRuntime.cs', 'src/tools/launcher/csharp/ProcessEvidenceCache.cs')

// Keep resource insertion order and source path order identical to the existing csc invocations.
def csharpExe = { Exec task, output, sources, List options, Map resources = [:] ->
    task.inputs.files(sources, resources.values())
    task.inputs.property('cscOptions', options)
    task.inputs.property('resourceNames', resources.keySet().toList())
    task.outputs.file(output)
    task.doFirst {
        if (!windowsHost) throw new GradleException("${task.name} requires Windows")
        def destination = output.get().asFile
        destination.parentFile.mkdirs()
        task.executable locateCSharpCompiler().absolutePath
        task.args '/nologo'
        task.args options
        task.args "/out:${destination.absolutePath}"
        task.args resources.collect { name, path -> "/resource:${path.get().asFile.absolutePath},${name}" }
        task.args sources.files.collect { it.absolutePath }.sort()
    }
}

def nestedGradleArguments = { List<String> arguments ->
    def result = new ArrayList<String>(arguments)
    result.addAll(["--console=plain", "--no-daemon", "--no-parallel",
            "--max-workers=${gradle.startParameter.maxWorkerCount}".toString()])
    // Gradle tracks previous task outputs in the project cache. Sharing that cache
    // across build directories lets a child delete its parent's compiled classes
    // as stale outputs, even when the builds execute sequentially.
    def buildArgument = arguments.find { it.startsWith('-Ptempos_build_directory=') }
    if (buildArgument != null) {
        def buildPath = buildArgument.substring('-Ptempos_build_directory='.length())
        result.addAll(['--project-cache-dir', new File(file(buildPath), '.gradle-project-cache').absolutePath])
    }
    if (gradle.startParameter.offline) {
        result.add("--offline")
    }
    // Preserve explicit JDK settings, including command-line -D overrides.
    ["org.gradle.java.home", "org.gradle.java.installations.paths",
     "org.gradle.java.installations.auto-detect", "org.gradle.java.installations.auto-download"].each { name ->
        def value = gradle.startParameter.systemPropertiesArgs[name]
                ?: providers.gradleProperty(name).orNull
        if (value != null) {
            result.add("-D${name}=${value}".toString())
        }
    }
    return result
}

ext.temposToolchains = [
        locateCmake          : locateCmake,
        locateJdkHome        : locateJdkHome,
        locateCSharpCompiler : locateCSharpCompiler,
        csharpExe            : csharpExe,
        launcherCommonSources: launcherCommonSources,
        gradleExecutable     : new File(gradle.gradleHomeDir, windowsHost ? "bin/gradle.bat" : "bin/gradle"),
        nestedGradleArguments: nestedGradleArguments
].asImmutable()
