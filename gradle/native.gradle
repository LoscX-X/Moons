/* JNI/JVMTI build and startup-agent verification. */
def windowsHost = moonsBuild.windowsHost
def versionedTestDirectory = moonsBuild.testDirectory
def loaderStagingDirectory = moonsBuild.loaderStagingDirectory
def locateCmake = moonsToolchains.locateCmake
def locateJdkHome = moonsToolchains.locateJdkHome
def apiJar = tasks.named("apiJar", Jar)
def nativeAgentFixtureJar = tasks.named("nativeAgentFixtureJar", Jar)

def nativeAgentSourceDirectory = layout.projectDirectory.dir("native-agent")
def nativeAgentBuildDirectory = layout.buildDirectory.dir("native-agent")
def nativeAgentBuiltDll = nativeAgentBuildDirectory.map { it.file("out/moons-native.dll") }
def nativeAgentTestDll = layout.buildDirectory.file(
        "${versionedTestDirectory}/native-agent/moons-native.dll")
def nativeAgentTestApiJar = layout.buildDirectory.file(
        "${versionedTestDirectory}/native-agent/moons-api.jar")

def configureNativeAgent = tasks.register("configureNativeAgent", Exec) {
    group = "verification"
    description = "Configures the test-only Windows JVMTI startup agent."
    onlyIf { windowsHost }
    inputs.files(fileTree(nativeAgentSourceDirectory) {
        include "CMakeLists.txt", "src/**/*.cpp", "src/**/*.h"
    })
    outputs.file(nativeAgentBuildDirectory.map { it.file("CMakeCache.txt") })

    doFirst {
        def cmake = locateCmake()
        def jdkHome = locateJdkHome()
        nativeAgentBuildDirectory.get().asFile.mkdirs()
        commandLine(
                cmake.absolutePath,
                "-S", nativeAgentSourceDirectory.asFile.absolutePath,
                "-B", nativeAgentBuildDirectory.get().asFile.absolutePath,
                "-G", "Visual Studio 17 2022",
                "-A", "x64",
                "-DJAVA_HOME=${jdkHome.absolutePath}"
        )
    }
}

def compileNativeAgent = tasks.register("compileNativeAgent", Exec) {
    group = "verification"
    description = "Builds the test-only startup JVMTI transport."
    dependsOn configureNativeAgent
    onlyIf { windowsHost }
    inputs.files(fileTree(nativeAgentSourceDirectory) {
        include "CMakeLists.txt", "src/**/*.cpp", "src/**/*.h"
    })
    outputs.file(nativeAgentBuiltDll)

    doFirst {
        commandLine(
                locateCmake().absolutePath,
                "--build", nativeAgentBuildDirectory.get().asFile.absolutePath,
                "--config", "Release",
                "--target", "moons-native"
        )
    }
}

def nativeAgentDll = tasks.register("nativeAgentDll") {
    group = "verification"
    description = "Stages the startup JVMTI transport under the test output tree."
    dependsOn compileNativeAgent
    onlyIf { windowsHost }
    inputs.file(nativeAgentBuiltDll)
    outputs.file(nativeAgentTestDll)

    doLast {
        def source = nativeAgentBuiltDll.get().asFile.toPath()
        def destination = nativeAgentTestDll.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                source,
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

def nativeAgentApiJar = tasks.register("nativeAgentApiJar") {
    group = "verification"
    description = "Stages the bootstrap API required by startup-agent tests."
    dependsOn apiJar
    inputs.file(apiJar.flatMap { it.archiveFile })
    outputs.file(nativeAgentTestApiJar)

    doLast {
        def source = apiJar.get().archiveFile.get().asFile.toPath()
        def destination = nativeAgentTestApiJar.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                source,
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

def verifyNativeAgent = tasks.register("verifyNativeAgent", JavaExec) {
    group = "verification"
    description = "Verifies JVMTI -> JNI -> Java ASM -> JVMTI class-byte transformation."
    dependsOn nativeAgentDll, nativeAgentFixtureJar
    onlyIf { windowsHost }
    classpath = files(nativeAgentFixtureJar.flatMap { it.archiveFile })
    mainClass = "com.blanoir.moons.nativebridge.NativeAgentVerification"

    doFirst {
        def dll = nativeAgentTestDll.get().asFile.absolutePath
        def fixture = nativeAgentFixtureJar.get().archiveFile.get().asFile.absolutePath
        setJvmArgs([
                "-agentpath:${dll}=jar=${fixture};"
                        + "bridge=com.blanoir.moons.nativebridge.NativeAgentVerificationBridge;"
                        + "include=com/blanoir/moons/nativebridge/NativeAgentVerificationTarget"
        ])
    }
}

def verifyNativeMoonsTransformer = tasks.register("verifyNativeMoonsTransformer", JavaExec) {
    group = "verification"
    description = "Verifies that JVMTI runs the production Moons tick transformer and bridge."
    dependsOn nativeAgentDll, nativeAgentApiJar, nativeAgentFixtureJar,
            tasks.named("moonsJar"), apiJar
    onlyIf { windowsHost }
    classpath = files(
            nativeAgentFixtureJar.flatMap { it.archiveFile },
            apiJar.flatMap { it.archiveFile }
    )
    mainClass = "com.blanoir.moons.nativebridge.NativeMoonsTransformerVerification"

    doFirst {
        def dll = nativeAgentTestDll.get().asFile.absolutePath
        def transformer = tasks.named("moonsJar", Jar).get().archiveFile.get().asFile.absolutePath
        def bootstrap = nativeAgentTestApiJar.get().asFile.absolutePath
        setJvmArgs([
                "-agentpath:${dll}=jar=${transformer};bootstrap=${bootstrap};"
                        + "include=net/minecraft/client/Minecraft"
        ])
    }
}

def nativeBridgeSourceDirectory = layout.projectDirectory.dir("native-bridge")
def nativeBridgeBuildDirectory = layout.buildDirectory.dir("native-bridge")
def nativeBridgeBuiltDll = nativeBridgeBuildDirectory.map { it.file("out/moons-bridge.dll") }
def nativeBridgeStagedDll = layout.buildDirectory.file(
        "${loaderStagingDirectory}/moons-bridge.dll")

def configureNativeBridge = tasks.register("configureNativeBridge", Exec) {
    group = "build"
    description = "Configures the Windows JNI bridge DLL for runtime load."
    onlyIf { windowsHost }
    inputs.files(fileTree(nativeBridgeSourceDirectory) {
        include "CMakeLists.txt", "src/**/*.cpp", "src/**/*.h"
    })
    outputs.file(nativeBridgeBuildDirectory.map { it.file("CMakeCache.txt") })

    doFirst {
        def cmake = locateCmake()
        def jdkHome = locateJdkHome()
        nativeBridgeBuildDirectory.get().asFile.mkdirs()
        commandLine(
                cmake.absolutePath,
                "-S", nativeBridgeSourceDirectory.asFile.absolutePath,
                "-B", nativeBridgeBuildDirectory.get().asFile.absolutePath,
                "-G", "Visual Studio 17 2022",
                "-A", "x64",
                "-DJAVA_HOME=${jdkHome.absolutePath}"
        )
    }
}

def compileNativeBridge = tasks.register("compileNativeBridge", Exec) {
    group = "build"
    description = "Builds moons-bridge.dll using the discovered Visual Studio toolchain."
    dependsOn configureNativeBridge
    onlyIf { windowsHost }
    inputs.files(fileTree(nativeBridgeSourceDirectory) {
        include "CMakeLists.txt", "src/**/*.cpp", "src/**/*.h"
    })
    outputs.file(nativeBridgeBuiltDll)

    doFirst {
        commandLine(
                locateCmake().absolutePath,
                "--build", nativeBridgeBuildDirectory.get().asFile.absolutePath,
                "--config", "Release",
                "--target", "moons-bridge"
        )
    }
}

def bridgeDll = tasks.register("bridgeDll") {
    group = "build"
    description = "Copies the JNI bridge DLL into build/dist."
    dependsOn compileNativeBridge
    onlyIf { windowsHost }
    inputs.file(nativeBridgeBuiltDll)
    outputs.file(nativeBridgeStagedDll)

    doLast {
        def source = nativeBridgeBuiltDll.get().asFile.toPath()
        def destination = nativeBridgeStagedDll.get().asFile.toPath()
        java.nio.file.Files.createDirectories(destination.parent)
        java.nio.file.Files.copy(
                source,
                destination,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

tasks.register("verifyJvmtiBridge", Exec) {
    group = "verification"
    description = "Loads the JNI/JVMTI bridge into the fake Minecraft JVM and verifies ASM hooks."
    dependsOn tasks.named("moonsJar"), tasks.named("loaderFixtureJar"), bridgeDll
    onlyIf { windowsHost }

    doFirst {
        def javaExecutable = new File(locateJdkHome(), "bin/java.exe")
        commandLine(
                "powershell.exe",
                "-NoProfile",
                "-ExecutionPolicy", "Bypass",
                "-File", file("scripts/verify-jvmti-bridge.ps1").absolutePath,
                "-Java", javaExecutable.absolutePath,
                "-Fixture", layout.buildDirectory.file(
                        "${versionedTestDirectory}/moons-loader-fixture.jar").get().asFile.absolutePath,
                "-Dll", nativeBridgeStagedDll.get().asFile.absolutePath,
                "-Payload", tasks.named("moonsJar", Jar).get()
                        .archiveFile.get().asFile.absolutePath
        )
    }
}

tasks.register("verifyJvmtiBridgeSystemLoader", Exec) {
    group = "verification"
    description = "Verifies the JNI/JVMTI bridge when Minecraft uses the vanilla system ClassLoader."
    dependsOn tasks.named("moonsJar"), tasks.named("loaderFixtureJar"), bridgeDll
    onlyIf { windowsHost }

    doFirst {
        def javaExecutable = new File(locateJdkHome(), "bin/java.exe")
        commandLine(
                "powershell.exe",
                "-NoProfile",
                "-ExecutionPolicy", "Bypass",
                "-File", file("scripts/verify-jvmti-bridge.ps1").absolutePath,
                "-Java", javaExecutable.absolutePath,
                "-Fixture", layout.buildDirectory.file(
                        "${versionedTestDirectory}/moons-loader-fixture.jar").get().asFile.absolutePath,
                "-Dll", nativeBridgeStagedDll.get().asFile.absolutePath,
                "-Payload", tasks.named("moonsJar", Jar).get()
                        .archiveFile.get().asFile.absolutePath,
                "-SystemLoader"
        )
    }
}
