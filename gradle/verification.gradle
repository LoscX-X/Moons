// Resolve a suite only for a requested check. Default check continues to compile its small suites.
ext.temposJavaChecks = { Map declarations ->
    declarations.each { taskName, spec ->
        tasks.register(taskName, JavaExec) {
            group = 'verification'
            description = spec.description
            def suite = sourceSets.getByName(spec.sourceSet)
            dependsOn suite.classesTaskName
            classpath = spec.classpath ? spec.classpath() : suite.runtimeClasspath
            if (spec.natives) classpath += configurations.minecraftNatives
            mainClass = spec.main
            if (spec.home) systemProperty 'tempos.home', layout.buildDirectory.dir(spec.home).get().asFile.absolutePath
            if (spec.buildWorkDir) workingDir layout.buildDirectory.get().asFile
            if (spec.argumentDir) args layout.buildDirectory.dir(spec.argumentDir).get().asFile.absolutePath
            if (spec.jvmArgs) jvmArgs spec.jvmArgs
            if (spec.maxHeap) maxHeapSize = spec.maxHeap
            if (spec.fixture) {
                def directory = layout.buildDirectory.dir(spec.fixture)
                doFirst {
                    directory.get().asFile.mkdirs()
                    args directory.get().asFile.absolutePath
                }
            }
        }
    }
}

