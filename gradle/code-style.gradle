// Formatters run in isolated JVMs; they never enter the Minecraft payload.
configurations {
    javaFormatter { canBeConsumed = false }
    kotlinFormatter { canBeConsumed = false }
}

dependencies {
    javaFormatter 'com.google.googlejavaformat:google-java-format:1.34.0'
    kotlinFormatter 'com.facebook:ktfmt:0.63'
}

def javaSources = files(fileTree('src') { include '**/*.java' },
        fileTree('tools') { include '**/*.java' })
def kotlinSources = fileTree('src') { include '**/*.kt', '**/*.kts' }

def registerFormatter = { String taskName, boolean javaLanguage ->
    tasks.register(taskName, JavaExec) {
        group = 'formatting'
        description = "Formats all ${javaLanguage ? 'Java' : 'Kotlin'} sources, including all Minecraft versions."
        def sources = javaLanguage ? javaSources : kotlinSources
        classpath = javaLanguage ? configurations.javaFormatter : configurations.kotlinFormatter
        mainClass = javaLanguage ? 'com.google.googlejavaformat.java.Main' : 'com.facebook.ktfmt.cli.Main'
        workingDir = project.projectDir
        inputs.files(sources).withPathSensitivity(PathSensitivity.RELATIVE)
        if (javaLanguage) {
            jvmArgs(['api', 'file', 'parser', 'tree', 'util', 'code'].collect {
                "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
            })
        }
        doFirst {
            // Use formatter argument files to avoid Windows' command-line length limit.
            def argumentFile = layout.buildDirectory.file("formatting/${taskName}.args").get().asFile
            argumentFile.parentFile.mkdirs()
            def options = javaLanguage
                    ? ['--aosp', '--skip-reflowing-long-strings', '--skip-javadoc-formatting']
                    : ['--kotlinlang-style']
            if (javaLanguage) options += ['--replace']
            def paths = sources.files.collect { project.relativePath(it) }.sort()
            argumentFile.setText((options + paths).join('\n') + '\n', 'UTF-8')
            setArgs(["@${argumentFile.absolutePath}"])
        }
    }
}

registerFormatter('formatJava', true)
registerFormatter('formatKotlin', false)

def textSources = files(
        fileTree('src') { include '**/*.cs' },
        fileTree('native-bridge') { include '**/*.cpp', '**/*.h', 'CMakeLists.txt' },
        fileTree('gradle') { include '**/*.gradle' },
        fileTree('scripts') { include '**/*.ps1' },
        'build.gradle', 'settings.gradle', 'gradle.properties', '.editorconfig', '.gitattributes')

def normalizedText = { File source ->
    def text = source.getText('UTF-8').replace('\r\n', '\n').replace('\r', '\n')
    text = text.replaceAll(/(?m)[\t ]+$/, '').replaceAll(/\n*\z/, '') + '\n'
    source.name.endsWith('.ps1') ? text.replace('\n', '\r\n') : text
}

tasks.register('formatText') {
    group = 'formatting'
    description = 'Normalizes trailing whitespace and final newlines without changing code tokens.'
    doLast {
        textSources.files.each { source ->
            def formatted = normalizedText(source)
            if (source.getText('UTF-8') != formatted) source.setText(formatted, 'UTF-8')
        }
    }
}

tasks.register('formatCode') {
    group = 'formatting'
    description = 'Applies the repository Java, Kotlin and text formatting conventions.'
    dependsOn 'formatJava', 'formatKotlin', 'formatText'
}
