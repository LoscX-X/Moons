plugins {
    id 'net.fabricmc.fabric-loom' version "1.17.19"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20'
    id 'org.jetbrains.compose' version '1.10.3'
    id 'com.gradleup.shadow' version '9.2.2'
}

// Applied scripts have their own classloader; resolve plugin types here.
ext.moonsPluginTypes = [
        kotlinCompile: org.jetbrains.kotlin.gradle.tasks.KotlinCompile,
        jvmTarget25  : org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25,
        shadowJar    : com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
].asImmutable()

// Applied scripts share only this immutable configuration and the lazily
// resolved tools in moonsToolchains. Task providers are obtained by name.
def supportedVersions = ["26.1.2": "26_1", "26.2": "26_2", "26.3-pre-3": "26_3"].asImmutable()
def minecraftVersion = project.minecraft_version.toString()
def versionDirectory = supportedVersions[minecraftVersion]
if (versionDirectory == null) {
    throw new GradleException("Unsupported Minecraft version ${minecraftVersion}; expected one of "
            + supportedVersions.keySet().join(", "))
}

// Nested builds must never overwrite another version's compiler/native output.
def isolatedBuildDirectory = providers.gradleProperty("moons_build_directory").orNull
if (isolatedBuildDirectory != null && !isolatedBuildDirectory.isBlank()) {
    layout.buildDirectory.set(file(isolatedBuildDirectory))
}

ext.moonsBuild = [
        minecraftVersion       : minecraftVersion,
        supportedVersions      : supportedVersions,
        versionDirectory       : versionDirectory,
        payloadDirectory       : "moons-payload/${versionDirectory}",
        testDirectory          : "moons-test/${versionDirectory}",
        loaderStagingDirectory : "loader-staging/${versionDirectory}",
        // A loaded JVM can hold the public agent JAR open on Windows.
        jarOutputDirectory     : providers.gradleProperty("moons_jar_output_directory")
                .getOrElse("dist/agent/${versionDirectory}"),
        windowsHost            : System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows"),
        targetJavaVersion      : 25
].asImmutable()

apply from: "gradle/toolchains.gradle"
apply from: "gradle/java-conventions.gradle"
apply from: "gradle/payloads.gradle"
apply from: "gradle/native.gradle"
apply from: "gradle/distribution.gradle"
apply from: "gradle/source-layout.gradle"
apply from: "gradle/verification.gradle"
apply from: "gradle/code-style.gradle"
