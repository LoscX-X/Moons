def clientVerificationTasks = clientVerifications.collect { taskName, verification ->
    tasks.register(taskName, JavaExec) {
        group = "verification"
        description = verification.description
        dependsOn tasks.named("testClasses")
        classpath = sourceSets.test.runtimeClasspath
        mainClass = verification.mainClass
    }
}

tasks.named("verifyAdvancedAntiBot", JavaExec) {
    if (providers.gradleProperty("antibot_legacy_mode").isPresent()) {
        args providers.gradleProperty("antibot_legacy_mode").get()
    }
}

tasks.named("verifyClickGuiWarmup", JavaExec) {
    systemProperty "java.awt.headless", "true"
}

tasks.named("verifySettingsClickGui", JavaExec) {
    systemProperty "java.awt.headless", "true"
    systemProperty "moons.gui.previewDir", layout.buildDirectory.dir("gui-preview").get().asFile.absolutePath
}

def featureMetadataFile = layout.buildDirectory.file(
        "resources/features/META-INF/moons-module.properties")
def verifyFeatureMetadata = tasks.register("verifyFeatureMetadata") {
    group = "verification"
    description = "Verifies the expanded feature module metadata."
    dependsOn tasks.named("processFeaturesResources")
    inputs.file(featureMetadataFile)

    doLast {
        def metadataFile = featureMetadataFile.get().asFile
        if (!metadataFile.isFile()) {
            throw new GradleException("Feature metadata was not produced: ${metadataFile}")
        }

        def metadataText = metadataFile.getText("UTF-8")
        if (metadataText.contains('${')) {
            throw new GradleException(
                    "Feature metadata contains an unexpanded placeholder: ${metadataFile}")
        }

        def metadata = new Properties()
        metadataFile.withInputStream { metadata.load(it) }
        def metadataMinecraftVersion = metadata.getProperty("minecraft")
        if (metadataMinecraftVersion != selectedMinecraftVersion) {
            throw new GradleException(
                    "Feature metadata minecraft version ${metadataMinecraftVersion} does not match "
                            + "selected version ${selectedMinecraftVersion}")
        }
    }
}

tasks.register("verifyMinecraftTransformers", JavaExec) {
    group = "verification"
    description = "Transforms and bytecode-verifies every supported hook against the actual Minecraft JAR."
    dependsOn tasks.named("loaderTestClasses")
    classpath = sourceSets.loaderTest.runtimeClasspath
    mainClass = "com.blanoir.moons.agent.core.TransformerVerification"
    doFirst {
        def minecraftJars = sourceSets.client.compileClasspath.files.findAll {
            it.name.toLowerCase(Locale.ROOT).startsWith("minecraft-")
                    && it.name.toLowerCase(Locale.ROOT).endsWith(".jar")
        }
        if (minecraftJars.isEmpty()) {
            throw new GradleException("Unable to locate the Loom Minecraft JARs")
        }
        def sodiumJar = file("libs/sodium.jar")
        if (sodiumJar.isFile()) minecraftJars.add(sodiumJar)
        args = minecraftJars.collect { it.absolutePath }
    }
}

tasks.register("verifyRuntimeLifecycle", JavaExec) {
    group = "verification"
    description = "Verifies deterministic subscription and module resource cleanup."
    dependsOn tasks.named("loaderTestClasses")
    classpath = sourceSets.loaderTest.runtimeClasspath
    mainClass = "com.blanoir.moons.runtime.LifecycleVerification"
}

tasks.named("check").configure {
    dependsOn "clientClasses", "featuresClasses", "verifyFeatureMetadata", "verifySourceLayout"
    dependsOn clientVerificationTasks
    dependsOn "verifyMinecraftTransformers", "verifyRuntimeLifecycle"
    dependsOn "verifyNativeAgent", "verifyNativeMoonsTransformer"
}

// A Gradle invocation selects exactly one Minecraft version. Run each complete
// check in its own output tree, sequentially, using this Gradle distribution.
def versionChecks = []
moonsBuild.supportedVersions.each { minecraftVersion, directory ->
    def previousCheck = versionChecks.isEmpty() ? null : versionChecks.last()
    def versionCheck = tasks.register("checkMinecraft${directory}", Exec) {
        group = "verification"
        description = "Runs the full check lifecycle for Minecraft ${minecraftVersion}."
        if (previousCheck != null) {
            mustRunAfter previousCheck
        }
        mustRunAfter tasks.named("check")
        workingDir project.projectDir
        executable moonsToolchains.gradleExecutable.absolutePath
        def nestedBuild = layout.buildDirectory.dir("checks/${directory}").get().asFile.absolutePath
        args moonsToolchains.nestedGradleArguments([
                "check",
                "-Pminecraft_version=${minecraftVersion}",
                "-Pmoons_build_directory=${nestedBuild}",
                "-Pmoons_jar_output_directory=verification/agent/${directory}"
        ].collect { it.toString() })
    }
    versionChecks.add(versionCheck)
}

def hostVerificationExecutable = layout.buildDirectory.file("verification/host/HostUtilsVerification.exe")
def compileHostUtilsVerification = tasks.register("compileHostUtilsVerification", Exec) {
    group = "verification"
    description = "Compiles the launcher with a utility-only verification entry point."
    def sources = files(
            fileTree("src/tools/launcher/csharp") { include "*.cs" },
            fileTree("src/tools/shared") { include "*.cs" },
            "src/test/host/csharp/HostUtilsVerification.cs")
    inputs.files(sources)
    outputs.file(hostVerificationExecutable)
    doFirst {
        def output = hostVerificationExecutable.get().asFile
        output.parentFile.mkdirs()
        executable moonsToolchains.locateCSharpCompiler().absolutePath
        args "/nologo", "/target:exe", "/platform:x64",
                "/main:Moons.Verification.HostUtilsVerification",
                "/reference:System.Windows.Forms.dll", "/reference:System.Management.dll",
                "/reference:System.IO.Compression.dll", "/reference:System.IO.Compression.FileSystem.dll",
                "/out:${output.absolutePath}"
        args sources.files.collect { it.absolutePath }.sort()
    }
}

def verifyHostUtilities = tasks.register("verifyHostUtilities", Exec) {
    group = "verification"
    description = "Verifies launcher utility I/O and compiles both Windows entry points."
    dependsOn compileHostUtilsVerification, tasks.named("moonsHwidExe")
    doFirst {
        executable hostVerificationExecutable.get().asFile.absolutePath
    }
}

tasks.register("verifyLauncherPackages", Exec) {
    group = "verification"
    description = "Checks embedded and external UI preparation using the built launchers, without starting the game."
    dependsOn tasks.named("moonsPackages"), compileHostUtilsVerification
    doFirst {
        executable hostVerificationExecutable.get().asFile.absolutePath
        args layout.buildDirectory.file("dist/moons-full.exe").get().asFile.absolutePath,
                layout.buildDirectory.file("dist/moons.exe").get().asFile.absolutePath,
                tasks.named("uiDependenciesJar", Jar).get().archiveFile.get().asFile.absolutePath
    }
}

tasks.register("checkAllVersions") {
    group = "verification"
    description = "Runs all verification gates sequentially against every supported Minecraft version."
    dependsOn versionChecks
    if (moonsBuild.windowsHost) {
        dependsOn verifyHostUtilities
    }
}
