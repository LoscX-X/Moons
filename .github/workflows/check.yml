name: Project checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        type: choice
        default: all
        options:
          - all
          - install
          - loader
          - ui-runtime
      verify:
        description: Verify Minecraft hooks, YSM rendering and update behavior
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify Minecraft hooks and YSM behavior
        if: github.event_name != 'workflow_dispatch' || inputs.verify
        shell: pwsh
        run: .\gradlew.bat verifyMinecraftTransformers checkAllVersions --console=plain
      - name: Package YSM for all supported versions
        if: github.event_name == 'pull_request' || (github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main')
        shell: pwsh
        run: .\gradlew.bat ysmAllVersions --console=plain
      - name: Build selected packages
        id: package
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ inputs.package || 'all' }}
          VERIFY_PACKAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.verify }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tasks = @(switch ($env:PACKAGE_KIND) {
            'all'        { @('moonsPackages') }
            'install'    { @('moonsInstallExe') }
            'loader'     { @('moonsExe') }
            'ui-runtime' { @('moonsUiRuntime') }
            default     { throw "Unknown package: $env:PACKAGE_KIND" }
          })
          if ($env:PACKAGE_KIND -eq 'all' -and $env:VERIFY_PACKAGES -eq 'true') {
            $tasks += 'verifyLauncherPackages'
          }
          $tag = "build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $runtimeUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/moons-ui-runtime.jar"
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "kind=$env:PACKAGE_KIND" >> $env:GITHUB_OUTPUT
          .\gradlew.bat @tasks "-Pmoons_ui_download_url=$runtimeUrl" --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload YSM bundles
        if: github.event_name != 'workflow_dispatch' || inputs.package != 'ui-runtime'
        uses: actions/upload-artifact@v6
        with:
          name: moons-ysm
          overwrite: true
          path: build/dist/moons-ysm-*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload UI runtime
        if: steps.package.outputs.kind != ''
        uses: actions/upload-artifact@v6
        with:
          name: moons-ui-runtime
          overwrite: true
          path: |
            build/dist/dependencies/moons-ui-runtime.jar
            build/dist/dependencies/moons-ui-runtime.jar.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Upload dependency installer
        if: steps.package.outputs.kind == 'all' || steps.package.outputs.kind == 'install'
        uses: actions/upload-artifact@v6
        with:
          name: moons-install
          overwrite: true
          path: build/dist/moon-install.exe
          if-no-files-found: error
          compression-level: 0
      - name: Upload game loader
        if: steps.package.outputs.kind == 'all' || steps.package.outputs.kind == 'loader'
        uses: actions/upload-artifact@v6
        with:
          name: moons-loader
          overwrite: true
          path: build/dist/moon.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: check
    if: needs.check.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: moons-*
          merge-multiple: true
          path: artifacts
      - name: Publish matching launchers and UI runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          - `moon-install.exe`: installs or updates matching UI dependencies, shared YSM libraries and game adapters. Run this first.
          - `moon.exe`: validates installed dependencies and loads Moons into Minecraft. Run the matching installer again when updating.
          - `moons-ui-runtime.jar`: standalone UI dependency, with a SHA-256 sidecar.
          - For offline installation, place this release's `moons-ui-runtime.jar` beside `moon-install.exe`.
          - `moons-ysm-all.zip`: standalone YSM bundle with one shared library set and all supported adapters.
          - `moons-ysm-<version>.zip`: optional standalone bundle for one game version.

          Only assets selected for this run are included. The loader supports Minecraft 26.1.2, 26.2, 26.3-rc-2 and 26.3-rc-3.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Build $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:8})" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
